<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ebook Reader Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* Layout: full-screen reader, minimal chrome; shelf screen first. Reader themes are the book's, not the device's. */
  :root {
    --page: #FFFFFF; --text: #1B1B1B; --muted: #6E6E6E; --line: #E4E4E4; --chrome: #F6F6F6; --accent: #0F6E8C;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --sans: "Atkinson Hyperlegible", -apple-system, "Segoe UI", sans-serif;
    --size: 19px;
  }
  body[data-theme-book="sepia"] { --page: #F4ECD8; --text: #3B2F22; --muted: #7A6A55; --line: #E2D6BC; --chrome: #EFE4CB; }
  body[data-theme-book="dark"] { --page: #121212; --text: #D9D9D9; --muted: #8A8A8A; --line: #2A2A2A; --chrome: #1C1C1C; --accent: #6CC3DD; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--text); font: 16px/1.5 var(--sans); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* Shelf */
  .shelf { max-width: 760px; margin: 0 auto; padding: 28px 16px 40px; display: flex; flex-direction: column; gap: 22px; }
  .shelf h1 { font: 600 28px/1.2 var(--serif); margin: 0; }
  .shelf p { margin: 0; color: var(--muted); }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 18px; }
  .book { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .cover { aspect-ratio: 2 / 3; max-width: 100%; border-radius: 4px; padding: 14px; display: flex; align-items: flex-end; color: #fff; font: 600 17px/1.2 var(--serif); box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .book small { color: var(--muted); font-size: 13px; }
  .bar2 { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; } .bar2 i { display: block; height: 100%; background: var(--accent); }
  .own { border: 1.5px dashed var(--line); border-radius: 10px; padding: 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .own p { flex: 1 1 260px; font-size: 14px; }
  .btn { border: 0; border-radius: 8px; padding: 10px 16px; background: var(--accent); color: #fff; font-weight: 700; cursor: pointer; }
  .err { color: #B3261E; font-size: 14px; }

  /* Reader */
  .reader { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--page); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .top, .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; color: var(--muted); font-size: 13px; transition: opacity .2s; }
  .top b { color: var(--text); font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .icon { border: 0; background: none; cursor: pointer; padding: 6px 8px; border-radius: 6px; font-weight: 700; color: var(--text); }
  .icon:hover { background: var(--chrome); }
  .tools { display: flex; gap: 2px; flex: none; }
  .viewport { position: relative; flex: 1; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .flow { position: absolute; top: 0; left: 0; height: 100%; font: var(--size)/1.6 var(--font, var(--serif)); text-align: justify; hyphens: auto; column-fill: auto; transition: transform .25s ease; }
  .flow h1, .flow h2, .flow h3 { font-family: var(--serif); text-align: left; line-height: 1.25; margin: .2em 0 1em; break-after: avoid; }
  .flow p { margin: 0; text-indent: 1.4em; }
  .flow p.first, .flow h1 + p, .flow h2 + p, .flow h3 + p { text-indent: 0; }
  .flow img { max-width: 100%; max-height: 80vh; display: block; margin: 1em auto; break-inside: avoid; }
  .zone { position: absolute; top: 0; bottom: 0; width: 30%; border: 0; background: none; cursor: pointer; z-index: 2; }
  .zone.l { left: 0; } .zone.r { right: 0; } .zone.c { left: 30%; width: 40%; }
  .mark { color: var(--muted); font-size: 11px; text-align: center; padding: 0 14px 6px; }
  .prog { height: 3px; background: var(--line); margin: 0 14px; border-radius: 2px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--accent); }
  body.calm .top, body.calm .foot .hint { opacity: .0; }

  /* Panels */
  .panel { position: absolute; top: calc(50px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 5; width: min(320px, calc(100% - 24px)); background: var(--page); color: var(--text); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.2); padding: 16px; display: flex; flex-direction: column; gap: 14px; max-height: 70vh; overflow: auto; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .row > span { font-size: 13px; color: var(--muted); }
  .seg { display: flex; gap: 6px; }
  .seg button { border: 1.5px solid var(--line); background: var(--chrome); border-radius: 8px; padding: 8px 12px; cursor: pointer; min-width: 44px; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); }
  .sw { width: 34px; height: 34px; border-radius: 50%; padding: 0 !important; min-width: 0 !important; }
  .toc { list-style: none; margin: 0; padding: 0; }
  .toc button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .toc button[aria-current="true"] { color: var(--accent); font-weight: 700; }
  @media (max-width: 500px) { .flow { text-align: left; } }
  @media (prefers-reduced-motion: reduce) { .flow { transition: none; } }
</style>
</head>
<body>

<main class="shelf" id="shelf">
  <div>
    <h1>My books</h1>
    <p>Signed in as asha@example.com · demo</p>
  </div>
  <div class="books" id="books"></div>
  <div class="own">
    <p><b>Try a real book file.</b> Open any EPUB from your computer to see it in this reader. The file stays on this device; nothing is uploaded.</p>
    <label class="btn" for="file" tabindex="0">Open an EPUB</label>
    <input id="file" type="file" accept=".epub,application/epub+zip" hidden>
  </div>
  <p class="err" id="err" hidden></p>
</main>

<section class="reader" id="reader" hidden aria-label="Reader">
  <div class="top">
    <button class="icon" id="back" aria-label="Back to my books">‹ Books</button>
    <b id="title"></b>
    <div class="tools"><button class="icon" id="tocBtn" aria-label="Contents">☰</button><button class="icon" id="aaBtn" aria-label="Text settings">Aa</button></div>
  </div>
  <div class="viewport" id="vp">
    <div class="flow" id="flow"></div>
    <button class="zone l" id="zl" aria-label="Previous page"></button>
    <button class="zone c" id="zc" aria-label="Show or hide menus"></button>
    <button class="zone r" id="zr" aria-label="Next page"></button>
    <div class="panel" id="aa" hidden>
      <div class="row"><span>Text size</span><div class="seg"><button id="smaller" aria-label="Smaller text">A−</button><button id="bigger" aria-label="Larger text">A+</button></div></div>
      <div class="row"><span>Font</span><div class="seg" id="fonts"><button data-f="serif">Serif</button><button data-f="sans">Sans</button></div></div>
      <div class="row"><span>Page</span><div class="seg" id="themes">
        <button class="sw" data-t="white" style="background:#fff" aria-label="White"></button>
        <button class="sw" data-t="sepia" style="background:#F4ECD8" aria-label="Sepia"></button>
        <button class="sw" data-t="dark" style="background:#121212" aria-label="Dark"></button></div></div>
    </div>
    <div class="panel" id="tocP" hidden><ul class="toc" id="toc"></ul></div>
  </div>
  <div class="foot"><span id="where"></span><span id="left"></span></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="mark" id="mark">Order #1042 · asha@example.com</div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(() => {
  const SAMPLE = {
    id: "sample", title: "The Lighthouse Twins", color: "#0F6E8C",
    chapters: [
      ["Chapter 1 · The Lamp Goes Out", [
        "Nobody on Kallan Island remembered the lighthouse ever going dark, so when it did, on the first night of the monsoon, the whole village came out of their houses to stare at the black tower on the rocks.",
        "Meera and her brother Arun stood at the front of the crowd. They were twins, eleven years old, and they had grown up close enough to the lighthouse to read by its beam through their bedroom window.",
        "\"It's the bulb,\" said Mr. Varghese, who ran the tea shop and had an opinion about everything. \"Old bulbs go. That's all.\"",
        "\"It isn't a bulb,\" Arun whispered. \"It's a lamp. A big one. Grandpa said it was brought here on a boat from Kochi.\"",
        "Meera wasn't listening. She was watching the narrow path that wound up the rocks to the lighthouse door, and on that path, just for a moment, she saw a torch flicker and then go out.",
        "Someone was up there.",
        "Out at sea, far beyond the reef, a fishing boat sounded its horn: one long note, then two short ones. Without the light, the boats had nothing to steer by. The reef had sunk three ships in her grandfather's lifetime, and he never stopped telling the stories.",
        "\"Arun,\" Meera said quietly. \"Get your shoes.\""
      ]],
      ["Chapter 2 · Ninety-Nine Steps", [
        "The path was slick with rain. Arun went first because he had the torch, and Meera came behind him, counting the stone steps under her breath the way their grandfather always had.",
        "Ninety-seven. Ninety-eight. Ninety-nine.",
        "The lighthouse door was open. It was never open. A brass padlock lay on the ground, not broken but unlocked, its key still in it.",
        "Inside, the air smelled of oil and salt. An iron staircase spiralled up into darkness. Somewhere above them, footsteps crossed the floor and stopped.",
        "\"Hello?\" Arun called, and his voice rang round the walls and came back to him three times.",
        "No one answered. But a moment later, a small round tin rolled down the stairs, clinking on every step, and stopped against Meera's foot.",
        "She picked it up. It was a lamp-wick tin, older than anything she had ever held, and scratched into the lid were four words: FOR THE NEXT KEEPER.",
        "Meera looked up the dark staircase. Then she looked at her brother. He was already climbing."
      ]],
      ["Chapter 3 · The Keeper's Logbook", [
        "At the top of the tower, the great lamp sat inside its cage of glass like a sleeping animal. The room was empty, but the logbook on the desk lay open, and the last entry was written in fresh ink.",
        "Light failed 7:42 pm. Wick spent. Spare wicks taken. Whoever finds this: the reef does not wait.",
        "\"Taken by who?\" Arun said. \"Why would anyone steal wicks?\"",
        "Meera was already turning the tin over in her hands. It rattled. She pried the lid open and found, rolled tight inside, a single new wick, white as a seashell.",
        "\"Someone wanted the light out,\" she said slowly. \"And someone else wanted us to be able to light it again.\"",
        "Far below, the fishing boat sounded its horn again, closer now. Much closer.",
        "Arun found the matches. Meera found the lever that opened the lamp. Neither of them had ever done this before, but they had watched their grandfather do it a hundred times, and their hands remembered more than they did.",
        "When the wick caught, the lamp drank the flame and the great lens began to turn, and a beam of light swept out across the black water, across the reef, across the little boat that was turning, just in time, towards home."
      ]]
    ]
  };
  const OTHERS = [["A Kite for Monsoon", "#9A3B26"], ["The Tea Garden Secret", "#3E5C2E"]];

  const $ = id => document.getElementById(id);
  const store = { get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } },
                  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const prefs = Object.assign({ size: 19, font: "serif", theme: "white" }, store.get("reader-prefs", {}));
  let book = null, ch = 0, page = 0, pages = 1, pageW = 0, frac = 0;

  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const sampleBook = () => ({ ...SAMPLE, chapters: SAMPLE.chapters.map(([t, ps]) => ({ title: t,
    html: `<h2>${esc(t)}</h2>` + ps.map((p, i) => `<p${i ? "" : ' class="first"'}>${esc(p)}</p>`).join("") })) });

  function renderShelf() {
    const pos = store.get("pos-sample", { ch: 0, frac: 0 });
    const pct = Math.round(((pos.ch + pos.frac) / SAMPLE.chapters.length) * 100);
    $("books").innerHTML = `<button class="book" id="open-sample"><span class="cover" style="background:${SAMPLE.color}">${SAMPLE.title}</span>
      <span class="bar2"><i style="width:${pct}%"></i></span><small>${pct}% read</small></button>` +
      OTHERS.map(([t, c]) => `<div class="book" aria-disabled="true"><span class="cover" style="background:${c};opacity:.45">${t}</span><small>Not bought · Buy in shop</small></div>`).join("");
    $("open-sample").onclick = () => openBook(sampleBook());
  }

  // EPUB: read container.xml -> OPF -> spine; each spine item becomes one chapter.
  async function loadEpub(file) {
    const zip = await JSZip.loadAsync(file);
    const xml = async p => new DOMParser().parseFromString(await zip.file(p).async("text"), "application/xml");
    const rootPath = (await xml("META-INF/container.xml")).querySelector("rootfile").getAttribute("full-path");
    const base = rootPath.includes("/") ? rootPath.slice(0, rootPath.lastIndexOf("/") + 1) : "";
    const opf = await xml(rootPath);
    const items = {}; opf.querySelectorAll("manifest > item").forEach(i => items[i.getAttribute("id")] = i.getAttribute("href"));
    const title = opf.getElementsByTagName("dc:title")[0]?.textContent || file.name.replace(/\.epub$/i, "");
    const resolve = (from, href) => { const parts = (from.slice(0, from.lastIndexOf("/") + 1) + href).split("/"), out = [];
      parts.forEach(p => p === ".." ? out.pop() : p !== "." && out.push(p)); return decodeURIComponent(out.join("/")); };
    const chapters = [];
    for (const ref of opf.querySelectorAll("spine > itemref")) {
      const path = base + items[ref.getAttribute("idref")]; const f = zip.file(decodeURIComponent(path)); if (!f) continue;
      const doc = new DOMParser().parseFromString(await f.async("text"), "application/xhtml+xml");
      const body = doc.body || doc.querySelector("body"); if (!body) continue;
      body.querySelectorAll("script, style, link, iframe, object, embed").forEach(n => n.remove());
      body.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || a.name === "style") n.removeAttribute(a.name); }));
      for (const img of body.querySelectorAll("img, image")) {
        const src = img.getAttribute("src") || img.getAttribute("xlink:href") || img.getAttribute("href");
        const imgFile = src && zip.file(resolve(path, src));
        if (imgFile) { const url = URL.createObjectURL(await imgFile.async("blob")); img.setAttribute(img.tagName.toLowerCase() === "img" ? "src" : "href", url); }
      }
      const text = body.textContent.trim(); if (!text && !body.querySelector("img, image")) continue;
      const h = body.querySelector("h1, h2, h3");
      chapters.push({ title: (h?.textContent || text.slice(0, 40) || `Section ${chapters.length + 1}`).trim(), html: body.innerHTML });
    }
    if (!chapters.length) throw new Error("No readable chapters");
    return { id: "file", title, chapters };
  }

  function openBook(b) {
    book = b; const pos = b.id === "sample" ? store.get("pos-sample", { ch: 0, frac: 0 }) : { ch: 0, frac: 0 };
    $("shelf").hidden = true; $("reader").hidden = false; $("title").textContent = b.title;
    $("toc").innerHTML = b.chapters.map((c, i) => `<li><button data-i="${i}">${esc(c.title)}</button></li>`).join("");
    loadChapter(Math.min(pos.ch, b.chapters.length - 1), pos.frac);
  }

  function layout() {
    const vp = $("vp"), flow = $("flow"), pad = Math.max(20, Math.min(64, vp.clientWidth * .08), (vp.clientWidth - 680) / 2);
    pageW = vp.clientWidth;
    Object.assign(flow.style, { width: pageW + "px", padding: `24px ${pad}px`, columnWidth: (pageW - 2 * pad) + "px", columnGap: 2 * pad + "px" });
    document.documentElement.style.setProperty("--size", prefs.size + "px");
    flow.style.setProperty("--font", prefs.font === "sans" ? "var(--sans)" : "var(--serif)");
    pages = Math.max(1, Math.round(flow.scrollWidth / pageW));
  }
  function loadChapter(i, f = 0) {
    ch = i; $("flow").innerHTML = book.chapters[i].html; layout();
    page = Math.min(pages - 1, Math.round(f * pages)); show();
    $("toc").querySelectorAll("button").forEach(b => b.setAttribute("aria-current", +b.dataset.i === ch));
  }
  function show() {
    $("flow").style.transform = `translateX(${-page * pageW}px)`;
    frac = pages > 1 ? page / pages : 0;
    const total = (ch + (page + 1) / pages) / book.chapters.length;
    $("bar").style.width = Math.round(total * 100) + "%";
    $("where").textContent = `Page ${page + 1} of ${pages} · ${Math.round(total * 100)}%`;
    const words = $("flow").textContent.trim().split(/\s+/).length, left = Math.ceil(words * (1 - (page + 1) / pages) / 200);
    $("left").textContent = left > 0 ? `${left} min left in chapter` : (ch < book.chapters.length - 1 ? "Next chapter ›" : "The end");
    if (book.id === "sample") store.set("pos-sample", { ch, frac });
  }
  function turn(d) {
    closePanels();
    if (page + d >= 0 && page + d < pages) { page += d; show(); return; }
    if (d > 0 && ch < book.chapters.length - 1) loadChapter(ch + 1, 0);
    else if (d < 0 && ch > 0) { loadChapter(ch - 1, 0); page = pages - 1; show(); }
  }
  function closePanels() { $("aa").hidden = $("tocP").hidden = true; }
  function applyPrefs() {
    document.body.dataset.themeBook = prefs.theme; store.set("reader-prefs", prefs);
    $("fonts").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.f === prefs.font));
    $("themes").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === prefs.theme));
    if (book) { const f = frac; layout(); page = Math.min(pages - 1, Math.round(f * pages)); show(); }
  }

  $("zl").onclick = () => turn(-1); $("zr").onclick = () => turn(1);
  $("zc").onclick = () => { closePanels(); document.body.classList.toggle("calm"); };
  $("aaBtn").onclick = () => { $("tocP").hidden = true; $("aa").hidden = !$("aa").hidden; };
  $("tocBtn").onclick = () => { $("aa").hidden = true; $("tocP").hidden = !$("tocP").hidden; };
  $("toc").onclick = e => { const b = e.target.closest("button"); if (b) { closePanels(); loadChapter(+b.dataset.i, 0); } };
  $("smaller").onclick = () => { prefs.size = Math.max(14, prefs.size - 2); applyPrefs(); };
  $("bigger").onclick = () => { prefs.size = Math.min(32, prefs.size + 2); applyPrefs(); };
  $("fonts").onclick = e => { const b = e.target.closest("button"); if (b) { prefs.font = b.dataset.f; applyPrefs(); } };
  $("themes").onclick = e => { const b = e.target.closest("button"); if (b) { prefs.theme = b.dataset.t; applyPrefs(); } };
  $("back").onclick = () => { closePanels(); document.body.classList.remove("calm"); $("reader").hidden = true; $("shelf").hidden = false; renderShelf(); };
  $("vp").addEventListener("contextmenu", e => e.preventDefault());
  let x0 = null;
  $("vp").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  $("vp").addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) turn(dx < 0 ? 1 : -1); x0 = null; });
  document.addEventListener("keydown", e => { if ($("reader").hidden) return;
    if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); turn(1); } if (e.key === "ArrowLeft") turn(-1); if (e.key === "Escape") closePanels(); });
  window.addEventListener("resize", () => { if (book && !$("reader").hidden) { const f = frac; layout(); page = Math.min(pages - 1, Math.round(f * pages)); show(); } });
  document.querySelector('label[for="file"]').addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
  $("file").onchange = async () => {
    const f = $("file").files[0]; if (!f) return; $("err").hidden = true;
    try { openBook(await loadEpub(f)); }
    catch { $("err").textContent = "That file couldn't be opened as an EPUB. Check that it isn't DRM-protected and try again."; $("err").hidden = false; }
    $("file").value = "";
  };
  if (document.fonts) document.fonts.ready.then(() => { if (book && !$("reader").hidden) { layout(); show(); } });
  applyPrefs(); renderShelf();
})();
</script>
</body>
</html>
