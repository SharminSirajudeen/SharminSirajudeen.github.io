<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Digital Marketing</title>
<meta name="description" content="A six-lesson advanced digital marketing course in English, Hindi, Tamil, Telugu and Malayalam.">
<style>
  @font-face{font-family:'Bricolage Grotesque';font-weight:500 800;font-display:swap;src:url(../fonts/bricolage-var.woff2) format('woff2')}
  @font-face{font-family:'Hanken Grotesk';font-weight:400;font-display:swap;src:url(../fonts/hanken-400.woff2) format('woff2')}
  @font-face{font-family:'Hanken Grotesk';font-weight:600;font-display:swap;src:url(../fonts/hanken-600.woff2) format('woff2')}
  :root{
    --paper:#F4F7F8; --card:#fff; --ink:#0B1A1F; --body:#33474e; --muted:#6a7f86; --line:#dce5e8;
    --accent:#0F4C5C; --accent-2:#11808F; --wash:#e9f2f3; --mark:#FB6A3C; --good:#1d7a4c; --bad:#c43d3d;
    --indic:"Noto Sans Devanagari","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Malayalam","Nirmala UI","Kohinoor Devanagari","Tamil Sangam MN","Telugu Sangam MN","Malayalam Sangam MN";
    --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",var(--indic),sans-serif;
    --display:"Bricolage Grotesque",-apple-system,"Segoe UI",var(--indic),sans-serif;
  }
  @media (prefers-color-scheme: dark){:root{
    --paper:#0b1417; --card:#111d21; --ink:#eef4f5; --body:#c3d1d5; --muted:#8aa0a6; --line:#22343a;
    --accent:#5fc2cf; --accent-2:#7fd3de; --wash:#14272c; --good:#5cc28d; --bad:#ef7b7b;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--body);font:17px/1.65 var(--sans)}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px}
  header{border-bottom:1px solid var(--line);background:var(--card)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
  .brand{font:700 15px var(--display);color:var(--accent);letter-spacing:.02em}
  label.lang{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
  select{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
  .hero{padding:36px 0 20px}
  .level{display:inline-block;font-size:13px;font-weight:600;color:var(--mark);text-transform:uppercase;letter-spacing:.08em}
  h1{font:800 clamp(30px,6vw,46px)/1.15 var(--display);color:var(--ink);margin:6px 0 10px}
  .sub{font-size:18px;margin:0;max-width:640px}
  nav.toc{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin:24px 0}
  nav.toc button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px;line-height:1.4}
  nav.toc button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
  nav.toc button:focus-visible,.btn:focus-visible,.opt input:focus-visible+span{outline:2px solid var(--accent-2);outline-offset:2px}
  nav.toc .n{font-weight:700;color:var(--accent)}
  article{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px clamp(18px,4vw,36px);margin-bottom:24px}
  .meta{font-size:14px;color:var(--muted)}
  h2{font:700 clamp(24px,4.5vw,32px)/1.25 var(--display);color:var(--ink);margin:6px 0 14px}
  h3{font:700 15px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:26px 0 8px}
  .intro{font-size:19px;color:var(--ink)}
  ul{padding-left:20px} li{margin:6px 0}
  .box{border-radius:10px;padding:16px 18px;margin:8px 0}
  .ex{background:var(--wash);border-left:4px solid var(--accent)}
  .warn{background:transparent;border:1px dashed var(--mark)}
  .q{border-top:1px solid var(--line);padding:16px 0}
  .q p{margin:0 0 10px;color:var(--ink);font-weight:600}
  .opt{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
  .opt input{margin-top:6px}
  .btn{font:600 15px var(--sans);border:0;border-radius:8px;padding:9px 16px;background:var(--accent);color:var(--card);cursor:pointer}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
  .fb{margin:10px 0 0;font-size:15px} .fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
  .pager{display:flex;justify-content:space-between;gap:12px;margin:0 0 28px}
  footer{color:var(--muted);font-size:14px;padding:8px 0 40px}
</style>
</head>
<body>
<header><div class="wrap bar">
  <span class="brand" id="brand"></span>
  <label class="lang"><span id="langLabel"></span><select id="lang"></select></label>
</div></header>
<main class="wrap">
  <section class="hero"><span class="level" id="level"></span><h1 id="title"></h1><p class="sub" id="sub"></p></section>
  <nav class="toc" id="toc" aria-labelledby="title"></nav>
  <article id="lesson" aria-live="polite"></article>
  <div class="pager"><button class="btn ghost" id="prev"></button><button class="btn" id="next"></button></div>
  <footer id="note"></footer>
</main>
<script>
const DATA = {"en": {"lang": "en", "langName": "English", "ui": {"courseTitle": "Advanced Digital Marketing", "courseSub": "Six lessons on measuring and growing a business with numbers you can defend.", "level": "Advanced", "minutes": "min", "lesson": "Lesson", "example": "Worked example", "mistake": "Common mistake", "takeaways": "Key takeaways", "quiz": "Check yourself", "check": "Check answer", "correct": "Correct.", "wrong": "Not quite.", "language": "Language", "contents": "Contents", "prev": "Previous", "next": "Next", "note": "Original course written for this demo. Translations are machine-made and have not yet been reviewed by native speakers."}, "modules": [{"title": "Unit economics: CAC, LTV and payback", "minutes": 12, "intro": "Every marketing decision becomes simpler once you know what a customer costs to win and what that customer is worth. Three numbers do most of the work.", "points": ["Customer acquisition cost (CAC) is marketing spend divided by the new paying customers it brought in during the same period.", "Lifetime value (LTV) is the profit a customer brings over their whole relationship with you: monthly contribution multiplied by expected lifetime in months. With a steady monthly churn rate, expected lifetime is 1 divided by that rate.", "Payback period is CAC divided by monthly contribution: how many months until a customer has repaid what it cost to win them."], "example": "A learning app spends ₹2,00,000 in a month and gains 400 paying subscribers, so CAC is ₹500. Each subscriber pays ₹299 a month at a 70% gross margin, a contribution of ₹209.30 a month. Monthly churn is 5%, so the expected lifetime is 1 ÷ 0.05 = 20 months and LTV is ₹209.30 × 20 = ₹4,186. LTV to CAC is 8.37, and payback takes ₹500 ÷ ₹209.30 = 2.39 months.", "mistake": "Using revenue instead of contribution for LTV. Revenue ignores the cost of serving the customer and makes every channel look more profitable than it is.", "takeaways": ["CAC and LTV must cover the same period and the same customers.", "LTV is built on contribution, not revenue.", "A short payback period protects cash, even when LTV to CAC looks healthy."], "quiz": [{"q": "Spend is ₹1,00,000 and it brings 250 new paying customers. What is the CAC?", "options": ["₹250", "₹400", "₹4,000"], "answer": 1, "why": "₹1,00,000 ÷ 250 = ₹400."}, {"q": "Monthly churn is 10%. With a steady churn rate, what is the expected customer lifetime?", "options": ["10 months", "12 months", "100 months"], "answer": 0, "why": "1 ÷ 0.10 = 10 months."}]}, {"title": "Experiments that tell the truth", "minutes": 14, "intro": "An A/B test is only as good as its design. Decide the question, the metric and the sample size before the test starts, not while it runs.", "points": ["Choose one primary metric in advance. Many metrics checked after the fact will produce a 'winner' by chance.", "Calculate the sample size from the baseline rate, the smallest change worth detecting, the significance level and the power you want.", "Do not stop a test the moment it looks significant. Repeated peeking raises the false-positive rate above the level you chose.", "Check the split: if you planned 50/50 and the groups are clearly uneven, the assignment is broken and the result cannot be trusted."], "example": "A sign-up page converts at 4%. You want to detect a rise to 5% at a 5% significance level (two-sided) with 80% power. Using the standard formula for two proportions, n = (1.96 + 0.8416)² × (0.04 × 0.96 + 0.05 × 0.95) ÷ 0.01² ≈ 6,742.2, so you need 6,743 visitors in each group, 13,486 in total, before you read the result.", "mistake": "Running the test for a fixed number of days instead of a fixed number of visitors, then stopping early because the graph looks good.", "takeaways": ["One primary metric, chosen before launch.", "Sample size is calculated, not guessed.", "An uneven split is a bug to fix, not a result to report."], "quiz": [{"q": "Why is checking results every day and stopping at the first significant reading a problem?", "options": ["It makes the test slower", "It raises the chance of a false positive", "It lowers the conversion rate"], "answer": 1, "why": "Each look is another chance for random noise to cross the threshold."}, {"q": "You planned a 50/50 split but got 58% and 42%. What should you do?", "options": ["Report the winner anyway", "Investigate the assignment before trusting the result", "Double the traffic"], "answer": 1, "why": "A clearly uneven split signals a broken assignment, which can bias the outcome."}]}, {"title": "Attribution versus incrementality", "minutes": 13, "intro": "Attribution tells you which ads a buyer touched. Incrementality tells you which sales would not have happened without the ads. Only the second tells you whether the spend paid off.", "points": ["Platform reports count conversions that followed an ad, including people who would have bought anyway.", "A holdout test keeps a random group from seeing the campaign. The difference in conversion rate between the groups is the campaign's real effect.", "Incremental CPA is spend divided by incremental conversions. It is usually higher than the CPA a platform reports."], "example": "A campaign reaches 9,00,000 people while a random 1,00,000 are held out. The exposed group converts at 3.0% (27,000 conversions) and the holdout at 2.6% (2,600). The lift is (3.0 − 2.6) ÷ 2.6 = 15.4%, and the incremental conversions are (0.030 − 0.026) × 9,00,000 = 3,600. The platform claimed 9,000 conversions, so only 40% of them were incremental. On ₹18,00,000 of spend, the reported CPA of ₹200 becomes an incremental CPA of ₹500.", "mistake": "Comparing people who saw the ad with people who did not, without random assignment. Those groups differ in many ways besides the ad.", "takeaways": ["Attributed conversions are not caused conversions.", "Random holdouts measure the real effect.", "Judge channels by incremental CPA."], "quiz": [{"q": "What makes a holdout group a fair comparison?", "options": ["It is chosen at random", "It contains your best customers", "It is the same size as the exposed group"], "answer": 0, "why": "Random assignment makes the groups alike in everything except the campaign."}, {"q": "Spend is ₹50,000 and the test shows 100 incremental conversions. What is the incremental CPA?", "options": ["₹50", "₹500", "₹5,000"], "answer": 1, "why": "₹50,000 ÷ 100 = ₹500."}]}, {"title": "Bidding from your own numbers", "minutes": 11, "intro": "Automated bidding works best when you give it targets that come from your economics, not from habit.", "points": ["Break-even ROAS is 1 divided by your gross margin. Below it, every sale from ads loses money before any other cost.", "The highest CPA you can afford on a first order is the order's contribution: average order value multiplied by gross margin. Use LTV instead only when repeat purchases are reliable.", "A maximum cost per click follows from target CPA multiplied by the conversion rate of the clicks."], "example": "A shop's gross margin is 40%, so break-even ROAS is 1 ÷ 0.40 = 2.5: every ₹1 of ad spend must bring ₹2.50 of revenue just to break even. With an average order of ₹2,000, the break-even CPA on a first order is ₹2,000 × 0.40 = ₹800. If you target a CPA of ₹500 and 2% of clicks convert, you can pay up to ₹500 × 0.02 = ₹10 a click.", "mistake": "Setting a target ROAS from a competitor's figure or an industry average. Your margin, not theirs, decides what you can pay.", "takeaways": ["Break-even ROAS = 1 ÷ gross margin.", "First-order CPA limit = average order value × gross margin.", "Max CPC = target CPA × conversion rate."], "quiz": [{"q": "Gross margin is 25%. What is the break-even ROAS?", "options": ["2.5", "4", "25"], "answer": 1, "why": "1 ÷ 0.25 = 4."}, {"q": "Target CPA is ₹800 and 5% of clicks convert. What is the maximum CPC?", "options": ["₹40", "₹160", "₹16"], "answer": 0, "why": "₹800 × 0.05 = ₹40."}]}, {"title": "Retention, cohorts and lifecycle", "minutes": 12, "intro": "Growth that leaks is expensive. Cohort analysis shows whether customers stay, and lifecycle messages help the right ones come back.", "points": ["A cohort is a group that started in the same period. Track what share of each cohort is still active in each later month.", "A retention curve that flattens means a core group keeps using the product. A curve that keeps falling towards zero means the product is not yet holding anyone.", "RFM scoring ranks customers by recency, frequency and monetary value, so messages go to the people they suit instead of to everyone."], "example": "Of 1,000 people who joined in January, 600 are active in month 1, 450 in month 2, 400 in month 3 and 390 in month 4. The drop shrinks from 150 to 50 to 10 people, so the curve is flattening at about 39%: a core is staying. Win-back messages should go to recent leavers who were frequent users, not to the whole list.", "mistake": "Reporting one blended retention rate for all customers. New and old cohorts mixed together hide whether retention is getting better or worse.", "takeaways": ["Read retention by cohort, never blended.", "A flattening curve is the signal to start scaling acquisition.", "Segment before you message."], "quiz": [{"q": "What does a retention curve that flattens tell you?", "options": ["Everyone will leave eventually", "A core group keeps using the product", "Acquisition has stopped"], "answer": 1, "why": "A flat tail means the remaining customers are staying month after month."}, {"q": "What do the letters in RFM stand for?", "options": ["Reach, frequency, media", "Recency, frequency, monetary value", "Revenue, funnel, margin"], "answer": 1, "why": "RFM ranks customers by how recently, how often and how much they buy."}]}, {"title": "First-party data and consent", "minutes": 10, "intro": "Data that customers give you directly, with their clear agreement, is the most reliable data you will have and the safest to use.", "points": ["First-party data is what people share with you directly: sign-ups, purchases, preferences, answers to your questions.", "India's Digital Personal Data Protection Act, 2023, Section 6(1), requires consent to be 'free, specific, informed, unconditional and unambiguous with a clear affirmative action'.", "Ask for the least data that does the job, say what each item is for, and make saying no as easy as saying yes."], "example": "A course platform wants to recommend lessons. Instead of tracking visitors across other websites, it asks one question at sign-up, 'What do you want to learn first?', with an unticked box for lesson emails. The answer shapes the home screen, and the email list holds only people who chose to join.", "mistake": "Pre-ticked boxes, or one checkbox that bundles unrelated purposes. Neither is a clear affirmative action for a specific purpose.", "takeaways": ["First-party data is earned, not collected in the background.", "Consent is specific to a purpose and given by a clear action.", "Less data, clearly explained, builds trust and better lists."], "quiz": [{"q": "Which of these is first-party data?", "options": ["Answers a customer gives in your sign-up form", "A list bought from a data broker", "Browsing history collected on other websites"], "answer": 0, "why": "First-party data is shared with you directly by the customer."}, {"q": "Is a pre-ticked consent box a clear affirmative action?", "options": ["Yes", "No"], "answer": 1, "why": "A box that is already ticked records no action by the person."}]}]}, "hi": {"lang": "hi", "langName": "हिन्दी", "ui": {"courseTitle": "एडवांस्ड डिजिटल मार्केटिंग", "courseSub": "छह पाठ, जो सिखाते हैं कि ऐसे आँकड़ों से बिज़नेस को कैसे मापें और बढ़ाएँ जिनका आप भरोसे के साथ बचाव कर सकें।", "level": "एडवांस्ड", "minutes": "मिनट", "lesson": "पाठ", "example": "हल किया हुआ उदाहरण", "mistake": "आम गलती", "takeaways": "मुख्य बातें", "quiz": "खुद को जाँचें", "check": "उत्तर जाँचें", "correct": "सही।", "wrong": "बिल्कुल सही नहीं।", "language": "भाषा", "contents": "विषय-सूची", "prev": "पिछला", "next": "अगला", "note": "यह मूल कोर्स इस डेमो के लिए लिखा गया है। अनुवाद मशीन से किए गए हैं और अभी तक मूल भाषा बोलने वालों ने इनकी समीक्षा नहीं की है।"}, "modules": [{"title": "यूनिट इकोनॉमिक्स: CAC, LTV और पेबैक", "minutes": 12, "intro": "जब आपको पता हो कि एक ग्राहक को जोड़ने में कितना खर्च आता है और वह ग्राहक आपके लिए कितना मूल्यवान है, तो मार्केटिंग का हर फ़ैसला आसान हो जाता है। ज़्यादातर काम तीन संख्याएँ कर देती हैं।", "points": ["ग्राहक अधिग्रहण लागत (CAC, यानी एक नया ग्राहक जोड़ने की लागत) वह मार्केटिंग खर्च है जिसे उसी अवधि में आए नए भुगतान करने वाले ग्राहकों की संख्या से भाग दिया गया हो।", "ग्राहक का जीवनकाल मूल्य (LTV, यानी एक ग्राहक से उसके पूरे जुड़ाव में होने वाला कुल मुनाफ़ा) वह मुनाफ़ा है जो ग्राहक आपके साथ अपने पूरे रिश्ते में लाता है: मासिक योगदान को अपेक्षित जीवनकाल (महीनों में) से गुणा करें। यदि हर महीने ग्राहकों के छोड़ जाने की दर (churn) स्थिर रहे, तो अपेक्षित जीवनकाल = 1 ÷ वह दर।", "पेबैक अवधि = CAC ÷ मासिक योगदान: यानी एक ग्राहक को जोड़ने में जो खर्च हुआ, वह कितने महीनों में वापस मिल जाता है।"], "example": "एक लर्निंग ऐप एक महीने में ₹2,00,000 खर्च करता है और 400 भुगतान करने वाले सब्सक्राइबर पाता है, इसलिए CAC ₹500 है। हर सब्सक्राइबर 70% ग्रॉस मार्जिन पर महीने के ₹299 देता है, यानी महीने का योगदान ₹209.30 है। मासिक churn 5% है, इसलिए अपेक्षित जीवनकाल 1 ÷ 0.05 = 20 महीने है और LTV = ₹209.30 × 20 = ₹4,186 है। LTV और CAC का अनुपात 8.37 है, और पेबैक में ₹500 ÷ ₹209.30 = 2.39 महीने लगते हैं।", "mistake": "LTV निकालने में योगदान की जगह रेवेन्यू का इस्तेमाल करना। रेवेन्यू में ग्राहक को सेवा देने का खर्च शामिल नहीं होता, इसलिए हर चैनल वास्तविकता से ज़्यादा मुनाफ़े वाला दिखता है।", "takeaways": ["CAC और LTV एक ही अवधि और एक ही ग्राहकों पर आधारित होने चाहिए।", "LTV योगदान पर बनता है, रेवेन्यू पर नहीं।", "LTV और CAC का अनुपात अच्छा दिखे तब भी, छोटी पेबैक अवधि आपका कैश सुरक्षित रखती है।"], "quiz": [{"q": "खर्च ₹1,00,000 है और उससे 250 नए भुगतान करने वाले ग्राहक आए। CAC कितना है?", "options": ["₹250", "₹400", "₹4,000"], "answer": 1, "why": "₹1,00,000 ÷ 250 = ₹400."}, {"q": "मासिक churn 10% है। churn दर स्थिर हो तो ग्राहक का अपेक्षित जीवनकाल कितना होगा?", "options": ["10 महीने", "12 महीने", "100 महीने"], "answer": 0, "why": "1 ÷ 0.10 = 10 महीने।"}]}, {"title": "ऐसे एक्सपेरिमेंट जो सच बताएँ", "minutes": 14, "intro": "A/B टेस्ट (दो वर्ज़न की आपस में तुलना करने वाला परीक्षण) उतना ही भरोसेमंद होता है जितना उसका डिज़ाइन। सवाल, मेट्रिक और सैंपल साइज़ टेस्ट शुरू होने से पहले तय करें, टेस्ट चलने के दौरान नहीं।", "points": ["एक प्राइमरी मेट्रिक पहले से चुन लें। नतीजे आने के बाद बहुत सारी मेट्रिक जाँचेंगे, तो संयोग से कोई न कोई 'विजेता' निकल ही आएगा।", "सैंपल साइज़ बेसलाइन दर, सबसे छोटे उस बदलाव जिसे पकड़ना ज़रूरी है, सिग्निफ़िकेंस लेवल और मनचाही पावर से निकालें।", "टेस्ट को उसी पल न रोकें जब वह सिग्निफ़िकेंट दिखने लगे। बार-बार झाँकने से फ़ॉल्स-पॉज़िटिव की दर आपके चुने हुए स्तर से ऊपर चली जाती है।", "स्प्लिट जाँचें: अगर आपने 50/50 की योजना बनाई थी और समूह साफ़ तौर पर असमान हैं, तो असाइनमेंट गड़बड़ है और नतीजे पर भरोसा नहीं किया जा सकता।"], "example": "एक साइन-अप पेज का कन्वर्ज़न 4% है। आप इसे 5% तक बढ़ता हुआ पकड़ना चाहते हैं, 5% सिग्निफ़िकेंस लेवल (दो-तरफ़ा) और 80% पावर के साथ। दो अनुपातों के लिए मानक सूत्र से, n = (1.96 + 0.8416)² × (0.04 × 0.96 + 0.05 × 0.95) ÷ 0.01² ≈ 6,742.2, यानी नतीजा पढ़ने से पहले आपको हर समूह में 6,743 विज़िटर चाहिए, कुल 13,486।", "mistake": "टेस्ट को विज़िटरों की तय संख्या तक चलाने के बजाय तय दिनों तक चलाना, और फिर ग्राफ़ अच्छा दिखने पर उसे जल्दी रोक देना।", "takeaways": ["लॉन्च से पहले चुनी गई एक प्राइमरी मेट्रिक।", "सैंपल साइज़ निकाला जाता है, अंदाज़े से तय नहीं किया जाता।", "असमान स्प्लिट एक बग है जिसे ठीक करना है, कोई नतीजा नहीं जिसे रिपोर्ट किया जाए।"], "quiz": [{"q": "हर दिन नतीजे देखना और पहली बार सिग्निफ़िकेंट रीडिंग आते ही टेस्ट रोक देना समस्या क्यों है?", "options": ["इससे टेस्ट धीमा हो जाता है", "इससे फ़ॉल्स पॉज़िटिव की संभावना बढ़ जाती है", "इससे कन्वर्ज़न दर घट जाती है"], "answer": 1, "why": "हर बार देखना, संयोग से बने शोर को सीमा पार करने का एक और मौका देना है।"}, {"q": "आपने 50/50 स्प्लिट की योजना बनाई थी, पर 58% और 42% मिला। आपको क्या करना चाहिए?", "options": ["फिर भी विजेता घोषित कर दें", "नतीजे पर भरोसा करने से पहले असाइनमेंट की जाँच करें", "ट्रैफ़िक दोगुना कर दें"], "answer": 1, "why": "साफ़ तौर पर असमान स्प्लिट बताता है कि असाइनमेंट गड़बड़ है, जिससे नतीजा पक्षपाती हो सकता है।"}]}, {"title": "एट्रिब्यूशन बनाम इंक्रीमेंटैलिटी", "minutes": 13, "intro": "एट्रिब्यूशन बताता है कि खरीदार ने कौन-से ad देखे या छुए। इंक्रीमेंटैलिटी बताती है कि कौन-सी बिक्री ads के बिना नहीं होती। खर्च वसूल हुआ या नहीं, यह सिर्फ़ दूसरी चीज़ बताती है।", "points": ["प्लैटफ़ॉर्म की रिपोर्टें उन सभी कन्वर्ज़न को गिनती हैं जो किसी ad के बाद हुए, उन लोगों के भी जो वैसे भी खरीद लेते।", "होल्डआउट टेस्ट में एक रैंडम समूह को campaign दिखाया ही नहीं जाता। दोनों समूहों की कन्वर्ज़न दर का अंतर ही campaign का असली असर है।", "इंक्रीमेंटल CPA (CPA यानी एक कन्वर्ज़न पर आने वाला खर्च) = खर्च ÷ इंक्रीमेंटल कन्वर्ज़न। यह आमतौर पर उस CPA से ज़्यादा होता है जो प्लैटफ़ॉर्म बताता है।"], "example": "एक campaign 9,00,000 लोगों तक पहुँचता है, जबकि रैंडम तरीके से चुने गए 1,00,000 लोगों को होल्डआउट में रखा जाता है। ad देखने वाला समूह 3.0% पर कन्वर्ट होता है (27,000 कन्वर्ज़न) और होल्डआउट 2.6% पर (2,600)। लिफ़्ट (3.0 − 2.6) ÷ 2.6 = 15.4% है, और इंक्रीमेंटल कन्वर्ज़न (0.030 − 0.026) × 9,00,000 = 3,600 हैं। प्लैटफ़ॉर्म ने 9,000 कन्वर्ज़न का दावा किया था, यानी उनमें से सिर्फ़ 40% इंक्रीमेंटल थे। ₹18,00,000 के खर्च पर, बताया गया ₹200 का CPA इंक्रीमेंटल CPA के रूप में ₹500 हो जाता है।", "mistake": "ad देखने वाले लोगों की तुलना ad न देखने वाले लोगों से करना, बिना रैंडम असाइनमेंट के। ऐसे समूह ad के अलावा भी कई बातों में अलग होते हैं।", "takeaways": ["एट्रिब्यूट किए गए कन्वर्ज़न का मतलब यह नहीं कि वे ad की वजह से हुए।", "रैंडम होल्डआउट असली असर मापते हैं।", "चैनलों को इंक्रीमेंटल CPA से परखें।"], "quiz": [{"q": "होल्डआउट समूह को निष्पक्ष तुलना किस बात से बनाती है?", "options": ["उसे रैंडम तरीके से चुना जाता है", "उसमें आपके सबसे अच्छे ग्राहक होते हैं", "उसका आकार ad देखने वाले समूह के बराबर होता है"], "answer": 0, "why": "रैंडम असाइनमेंट दोनों समूहों को campaign के अलावा हर बात में एक जैसा बना देता है।"}, {"q": "खर्च ₹50,000 है और टेस्ट में 100 इंक्रीमेंटल कन्वर्ज़न दिखे। इंक्रीमेंटल CPA कितना है?", "options": ["₹50", "₹500", "₹5,000"], "answer": 1, "why": "₹50,000 ÷ 100 = ₹500."}]}, {"title": "अपने ही आँकड़ों से बिडिंग", "minutes": 11, "intro": "ऑटोमेटेड बिडिंग तब सबसे अच्छा काम करती है जब आप उसे ऐसे टारगेट दें जो आपकी अपनी इकोनॉमिक्स से निकले हों, आदत से नहीं।", "points": ["ब्रेक-ईवन ROAS (ROAS यानी ad पर खर्च हुए हर रुपये से मिलने वाला रेवेन्यू) = 1 ÷ आपका ग्रॉस मार्जिन। इससे नीचे, ads से हुई हर बिक्री किसी और खर्च को गिनने से पहले ही घाटे में जाती है।", "पहले ऑर्डर पर आप जो सबसे ज़्यादा CPA (एक कन्वर्ज़न पर खर्च) झेल सकते हैं, वह उस ऑर्डर का योगदान है: औसत ऑर्डर वैल्यू × ग्रॉस मार्जिन। LTV तभी इस्तेमाल करें जब दोबारा खरीदारी भरोसेमंद हो।", "अधिकतम CPC (CPC यानी एक क्लिक पर खर्च) = टारगेट CPA × उन क्लिक की कन्वर्ज़न दर।"], "example": "एक दुकान का ग्रॉस मार्जिन 40% है, इसलिए ब्रेक-ईवन ROAS 1 ÷ 0.40 = 2.5 है: ad पर खर्च हुए हर ₹1 से सिर्फ़ ब्रेक-ईवन के लिए भी ₹2.50 का रेवेन्यू आना चाहिए। औसत ऑर्डर ₹2,000 का हो, तो पहले ऑर्डर पर ब्रेक-ईवन CPA ₹2,000 × 0.40 = ₹800 है। अगर आप ₹500 का CPA टारगेट करते हैं और 2% क्लिक कन्वर्ट होते हैं, तो आप एक क्लिक पर ज़्यादा से ज़्यादा ₹500 × 0.02 = ₹10 दे सकते हैं।", "mistake": "टारगेट ROAS किसी प्रतिस्पर्धी के आँकड़े या इंडस्ट्री औसत से तय करना। आप कितना दे सकते हैं, यह आपका मार्जिन तय करता है, उनका नहीं।", "takeaways": ["ब्रेक-ईवन ROAS = 1 ÷ ग्रॉस मार्जिन।", "पहले ऑर्डर की CPA सीमा = औसत ऑर्डर वैल्यू × ग्रॉस मार्जिन।", "अधिकतम CPC = टारगेट CPA × कन्वर्ज़न दर।"], "quiz": [{"q": "ग्रॉस मार्जिन 25% है। ब्रेक-ईवन ROAS कितना है?", "options": ["2.5", "4", "25"], "answer": 1, "why": "1 ÷ 0.25 = 4."}, {"q": "टारगेट CPA ₹800 है और 5% क्लिक कन्वर्ट होते हैं। अधिकतम CPC कितना है?", "options": ["₹40", "₹160", "₹16"], "answer": 0, "why": "₹800 × 0.05 = ₹40."}]}, {"title": "रिटेंशन, कोहोर्ट और लाइफ़साइकल", "minutes": 12, "intro": "जिस g": "ta", "langName": "தமிழ்", "ui": {"courseTitle": "மேம்பட்ட டிஜிட்டல் மார்க்கெட்டிங்", "courseSub": "நீங்கள் உறுதியாக நிரூபிக்கக்கூடிய எண்களைக் கொண்டு ஒரு வணிகத்தை அளந்து வளர்க்கும் ஆறு பாடங்கள்.", "level": "மேம்பட்டது", "minutes": "நிமி", "lesson": "பாடம்", "example": "தீர்க்கப்பட்ட எடுத்துக்காட்டு", "mistake": "பொதுவான தவறு", "takeaways": "முக்கியக் குறிப்புகள்", "quiz": "உங்களையே சோதித்துப் பாருங்கள்", "check": "விடையைச் சரிபார்", "correct": "சரி.", "wrong": "சரியல்ல.", "language": "மொழி", "contents": "உள்ளடக்கம்", "prev": "முந்தையது", "next": "அடுத்தது", "note": "இந்தச் செயல்விளக்கத்திற்காக எழுதப்பட்ட மூலப் பாடநெறி இது. மொழிபெயர்ப்புகள் இயந்திரம் மூலம் செய்யப்பட்டவை; தாய்மொழி பேசுபவர்கள் இன்னும் மதிப்பாய்வு செய்யவில்லை."}, "modules": [{"title": "யூனிட் எகனாமிக்ஸ்: CAC, LTV மற்றும் பேபேக்", "minutes": 12, "intro": "ஒரு வாடிக்கையாளரைப் பெற எவ்வளவு செலவாகிறது, அந்த வாடிக்கையாளரின் மதிப்பு என்ன என்பதை அறிந்துவிட்டால், ஒவ்வொரு மார்க்கெட்டிங் முடிவும் எளிதாகிறது. மூன்று எண்கள் பெரும்பாலான வேலையைச் செய்கின்றன.", "points": ["வாடிக்கையாளர் கையகப்படுத்தும் செலவு (CAC) என்பது, அதே காலகட்டத்தில் புதிதாகப் பணம் செலுத்திய வாடிக்கையாளர்களால் மார்க்கெட்டிங் செலவைப் பிரித்த தொகை.", "வாடிக்கையாளர் வாழ்நாள் மதிப்பு (LTV) என்பது, ஒரு வாடிக்கையாளர் உங்களுடன் இருக்கும் முழு காலத்திலும் உங்களுக்குத் தரும் லாபம்: மாதாந்திர பங்களிப்பை எதிர்பார்க்கப்படும் மாதங்களின் எண்ணிக்கையால் பெருக்கிய தொகை. மாதாந்திர விலகல் விகிதம் (churn) நிலையாக இருந்தால், எதிர்பார்க்கப்படும் காலம் என்பது 1-ஐ அந்த விகிதத்தால் வகுத்த எண்.", "பேபேக் காலம் என்பது CAC-ஐ மாதாந்திர பங்களிப்பால் வகுத்த எண்: ஒரு வாடிக்கையாளரைப் பெற ஆன செலவை அவர் திருப்பிச் செலுத்த எத்தனை மாதங்கள் ஆகும் என்பது."], "example": "ஒரு கற்றல் செயலி ஒரு மாதத்தில் ₹2,00,000 செலவு செய்து 400 கட்டணச் சந்தாதாரர்களைப் பெறுகிறது, எனவே CAC ₹500. ஒவ்வொரு சந்தாதாரரும் மாதம் ₹299 செலுத்துகிறார், மொத்த லாப விகிதம் 70%, அதாவது மாதத்துக்கு ₹209.30 பங்களிப்பு. மாதாந்திர churn 5% என்பதால், எதிர்பார்க்கப்படும் காலம் 1 ÷ 0.05 = 20 மாதங்கள்; LTV = ₹209.30 × 20 = ₹4,186. LTV : CAC = 8.37, பேபேக்கிற்கு ₹500 ÷ ₹209.30 = 2.39 மாதங்கள் ஆகும்.", "mistake": "LTV கணக்கிட பங்களிப்புக்குப் பதிலாக வருவாயைப் பயன்படுத்துவது. வருவாய், வாடிக்கையாளருக்குச் சேவை வழங்க ஆகும் செலவைக் கணக்கில் கொள்ளாது; அதனால் ஒவ்வொரு சேனலும் உண்மையை விட அதிக லாபம் தருவது போலத் தெரியும்.", "takeaways": ["CAC-யும் LTV-யும் ஒரே காலகட்டத்தையும் ஒரே வாடிக்கையாளர்களையும் உள்ளடக்க வேண்டும்.", "LTV பங்களிப்பின் அடிப்படையில் அமையும், வருவாயின் அடிப்படையில் அல்ல.", "LTV : CAC நன்றாகத் தெரிந்தாலும், குறுகிய பேபேக் காலம் கையிருப்புப் பணத்தைக் காக்கும்."], "quiz": [{"q": "செலவு ₹1,00,000, அது 250 புதிய கட்டண வாடிக்கையாளர்களைக் கொண்டு வருகிறது. CAC என்ன?", "options": ["₹250", "₹400", "₹4,000"], "answer": 1, "why": "₹1,00,000 ÷ 250 = ₹400."}, {"q": "மாதாந்திர churn 10%. churn விகிதம் நிலையாக இருந்தால், வாடிக்கையாளரின் எதிர்பார்க்கப்படும் காலம் என்ன?", "options": ["10 மாதங்கள்", "12 மாதங்கள்", "100 மாதங்கள்"], "answer": 0, "why": "1 ÷ 0.10 = 10 மாதங்கள்."}]}, {"title": "உண்மையைச் சொல்லும் சோதனைகள்", "minutes": 14, "intro": "A/B டெஸ்ட் (இரண்டு பதிப்புகளை ஒப்பிடும் சோதனை) அதன் வடிவமைப்பைப் பொறுத்தே நல்லதாக இருக்கும். கேள்வியையும், அளவீட்டையும், மாதிரி அளவையும் சோதனை தொடங்கும் முன்பே முடிவு செய்யுங்கள், அது நடக்கும்போது அல்ல.", "points": ["ஒரே ஒரு முதன்மை அளவீட்டை முன்கூட்டியே தேர்ந்தெடுங்கள். பின்னர் பல அளவீடுகளைப் பார்த்தால், தற்செயலாக ஒரு 'வெற்றியாளர்' தோன்றிவிடும்.", "அடிப்படை விகிதம், கண்டறியத் தகுந்த மிகச் சிறிய மாற்றம், முக்கியத்துவ நிலை (significance level), உங்களுக்கு வேண்டிய திறன் (power) ஆகியவற்றிலிருந்து மாதிரி அளவைக் கணக்கிடுங்கள்.", "சோதனை முக்கியத்துவம் பெற்றதாகத் தோன்றிய உடனே நிறுத்தாதீர்கள். மீண்டும் மீண்டும் எட்டிப் பார்ப்பது, நீங்கள் தேர்ந்தெடுத்த அளவை விடத் தவறான நேர்மறை (false positive) விகிதத்தை உயர்த்தும்.", "பிரிப்பைச் சரிபாருங்கள்: 50/50 என்று திட்டமிட்டு, குழுக்கள் தெளிவாகச் சமமின்றி இருந்தால், ஒதுக்கீடு உடைந்துவிட்டது; முடிவை நம்ப முடியாது."], "example": "ஒரு சைன்-அப் பக்கத்தின் கன்வெர்ஷன் 4%. 5% முக்கியத்துவ நிலையில் (இருபக்க), 80% திறனுடன், அது 5% ஆக உயர்வதைக் கண்டறிய விரும்புகிறீர்கள். இரண்டு விகிதங்களுக்கான நிலையான சூத்திரத்தின்படி, n = (1.96 + 0.8416)² × (0.04 × 0.96 + 0.05 × 0.95) ÷ 0.01² ≈ 6,742.2; எனவே முடிவைப் படிக்கும் முன் ஒவ்வொரு குழுவிலும் 6,743 பார்வையாளர்கள், மொத்தம் 13,486 பேர் தேவை.", "mistake": "நிலையான பார்வையாளர் எண்ணிக்கைக்குப் பதிலாக நிலையான நாட்களுக்குச் சோதனையை ஓட்டுவது, பிறகு வரைபடம் நன்றாகத் தெரிகிறது என்பதற்காக முன்கூட்டியே நிறுத்துவது.", "takeaways": ["ஒரே ஒரு முதன்மை அளவீடு, தொடங்கும் முன்பே தேர்ந்தெடுக்கப்பட்டது.", "மாதிரி அளவு கணக்கிடப்படுகிறது, ஊகிக்கப்படுவதில்லை.", "சமமற்ற பிரிப்பு என்பது சரிசெய்ய வேண்டிய பிழை, அறிக்கையிட வேண்டிய முடிவு அல்ல."], "quiz": [{"q": "தினமும் முடிவுகளைப் பார்த்து, முதல் முறை முக்கியத்துவம் தெரிந்தவுடன் நிறுத்துவது ஏன் பிரச்சினை?", "options": ["அது சோதனையை மெதுவாக்குகிறது", "அது தவறான நேர்மறை வருவதற்கான வாய்ப்பை உயர்த்துகிறது", "அது கன்வெர்ஷன் விகிதத்தைக் குறைக்கிறது"], "answer": 1, "why": "ஒவ்வொரு முறை பார்ப்பதும், தற்செயலான இரைச்சல் எல்லையைத் தாண்டுவதற்கான இன்னொரு வாய்ப்பு."}, {"q": "50/50 பிரிப்பைத் திட்டமிட்டீர்கள், ஆனால் 58% மற்றும் 42% கிடைத்தது. என்ன செய்ய வேண்டும்?", "options": ["எப்படியும் வெற்றியாளரை அறிவிக்க வேண்டும்", "முடிவை நம்பும் முன் ஒதுக்கீட்டை ஆராய வேண்டும்", "டிராஃபிக்கை இரட்டிப்பாக்க வேண்டும்"], "answer": 1, "why": "தெளிவாகச் சமமற்ற பிரிப்பு, ஒதுக்கீடு உடைந்துள்ளதைக் காட்டுகிறது; அது முடிவைச் சாய்த்துவிடக்கூடும்."}]}, {"title": "அட்ரிபியூஷன் vs இன்க்ரிமென்ட்டாலிட்டி", "minutes": 13, "intro": "வாங்கியவர் எந்த விளம்பரங்களைத் தொட்டார் என்பதை அட்ரிபியூஷன் சொல்கிறது. விளம்பரங்கள் இல்லாவிட்டால் எந்த விற்பனைகள் நடந்திருக்காது என்பதை இன்க்ரிமென்ட்டாலிட்டி சொல்கிறது. செலவு பலன் தந்ததா என்பதை இரண்டாவது மட்டுமே சொல்கிறது.", "points": ["விளம்பர தளங்களின் அறிக்கைகள், விளம்பரத்தைத் தொடர்ந்து நடந்த கன்வெர்ஷன்கள் அனைத்தையும் எண்ணுகின்றன; எப்படியும் வாங்கியிருக்கக்கூடியவர்களும் அதில் அடங்குவர்.", "ஹோல்டவுட் டெஸ்ட் என்பது, ஒரு சீரற்ற குழுவினர் கேம்பெயினைப் பார்க்காதபடி வைப்பது. குழுக்களுக்கு இடையிலான கன்வெர்ஷன் விகித வேறுபாடே அந்தக் கேம்பெயினின் உண்மையான விளைவு.", "இன்க்ரிமென்டல் CPA (ஒரு கன்வெர்ஷனைப் பெற ஆகும் செலவு) என்பது செலவை இன்க்ரிமென்டல் கன்வெர்ஷன்களால் வகுத்த தொகை. இது பொதுவாக ஒரு தளம் தெரிவிக்கும் CPA-வை விட அதிகமாக இருக்கும்."], "example": "ஒரு கேம்பெயின் 9,00,000 பேரை அடைகிறது, அதே நேரத்தில் சீரற்ற முறையில் 1,00,000 பேர் ஹோல்டவுட்டாக விலக்கப்படுகிறார்கள். பார்த்த குழு 3.0% (27,000 கன்வெர்ஷன்கள்), ஹோல்டவுட் குழு 2.6% (2,600) கன்வெர்ட் ஆகிறது. லிஃப்ட் = (3.0 − 2.6) ÷ 2.6 = 15.4%, இன்க்ரிமென்டல் கன்வெர்ஷன்கள் = (0.030 − 0.026) × 9,00,000 = 3,600. தளம் 9,000 கன்வெர்ஷன்கள் என்று கூறியது, அதாவது 40% மட்டுமே இன்க்ரிமென்டல். ₹18,00,000 செலவில், அறிக்கையிடப்பட்ட CPA ₹200 என்பது இன்க்ரிமென்டல் CPA ₹500 ஆகிறது.", "mistake": "சீரற்ற ஒதுக்கீடு இல்லாமல், விளம்பரத்தைப் பார்த்தவர்களை பார்க்காதவர்களுடன் ஒப்பிடுவது. விளம்பரத்தைத் தவிர வேறு பல வழிகளிலும் அந்தக் குழுக்கள் வேறுபடுகின்றன.", "takeaways": ["அட்ரிபியூட் செய்யப்பட்ட கன்வெர்ஷன்கள் என்பவை விளம்பரத்தால் ஏற்பட்ட கன்வெர்ஷன்கள் அல்ல.", "சீரற்ற ஹோல்டவுட்கள் உண்மையான விளைவை அளக்கின்றன.", "சேனல்களை இன்க்ரிமென்டல் CPA கொண்டு மதிப்பிடுங்கள்."], "quiz": [{"q": "ஹோல்டவுட் குழுவை நியாயமான ஒப்பீடாக ஆக்குவது எது?", "options": ["அது சீரற்ற முறையில் தேர்ந்தெடுக்கப்படுகிறது", "அதில் உங்கள் சிறந்த வாடிக்கையாளர்கள் இருக்கிறார்கள்", "அது பார்த்த குழுவின் அதே அளவில் இருக்கிறது"], "answer": 0, "why": "சீரற்ற ஒதுக்கீடு, கேம்பெயினைத் தவிர மற்ற அனைத்திலும் குழுக்களை ஒன்று போல ஆக்குகிறது."}, {"q": "செலவு ₹50,000, சோதனை 100 இன்க்ரிமென்டல் கன்வெர்ஷன்களைக் காட்டுகிறது. இன்க்ரிமென்டல் CPA என்ன?", "options": ["₹50", "₹500", "₹5,000"], "answer": 1, "why": "₹50,000 ÷ 100 = ₹500."}]}, {"title": "உங்கள் சொந்த எண்களிலிருந்து பிட்டிங்", "minutes": 11, "intro": "பழக்கத்திலிருந்து அல்லாமல், உங்கள் பொருளாதாரக் கணக்கிலிருந்து வரும் இலக்குகளை ஆட்டோமேட்டட் பிட்டிங்கிற்குக் கொடுத்தால் அது சிறப்பாகச் செயல்படும்.", "points": ["பிரேக்-ஈவன் ROAS (விளம்பரச் செலவுக்கு எவ்வளவு வருவாய் கிடைக்கிறது என்ற விகிதம்) என்பது 1-ஐ உங்கள் மொத்த லாப விகிதத்தால் வகுத்த எண். அதற்குக் கீழே இருந்தால், விளம்பரங்கள் மூலம் வரும் ஒவ்வொரு விற்பனையும் மற்ற செலவுகளுக்கு முன்பே நஷ்டத்தைத் தரும்.", "முதல் ஆர்டரில் நீங்கள் தாங்கக்கூடிய அதிகபட்ச CPA (ஒரு கன்வெர்ஷனுக்கான செலவு) என்பது அந்த ஆர்டரின் பங்களிப்பு: சராசரி ஆர்டர் மதிப்பை மொத்த லாப விகிதத்தால் பெருக்கிய தொகை. மீண்டும் வாங்குதல்கள் நம்பகமாக இருக்கும்போது மட்டுமே இதற்குப் பதிலாக LTV-ஐப் பயன்படுத்துங்கள்.", "அதிகபட்ச CPC (ஒரு கிளிக்கிற்கான செலவு) என்பது இலக்கு CPA-வை கிளிக்குகளின் கன்வெர்ஷன் விகிதத்தால் பெருக்கிக் கிடைப்பது."], "example": "ஒரு கடையின் மொத்த லாப விகிதம் 40%, எனவே பிரேக்-ஈவன் ROAS = 1 ÷ 0.40 = 2.5: விளம்பரத்தில் செலவிடும் ஒவ்வொரு ₹1-க்கும், சமன் செய்யவே ₹2.50 வருவாய் வர வேண்டும். சராசரி ஆர்டர் ₹2,000 என்றால், முதல் ஆர்டரில் பிரேக்-ஈவன் CPA = ₹2,000 × 0.40 = ₹800. இலக்கு CPA ₹500 என்றும், 2% கிளிக்குகள் கன்வெர்ட் ஆகின்றன என்றும் வைத்தால், ஒரு கிளிக்கிற்கு ₹500 × 0.02 = ₹10 வரை செலுத்தலாம்.", "mistake": "போட்டியாளரின் எண்ணிலிருந்தோ தொழில்துறை சராசரியிலிருந்தோ இலக்கு ROAS-ஐ நிர்ணயிப்பது. நீங்கள் எவ்வளவு செலுத்தலாம் என்பதை உங்கள் லாப விகிதமே தீர்மானிக்கிறது, அவர்களுடையது அல்ல.", "takeaways": ["பிரேக்-ஈவன் ROAS = 1 ÷ மொத்த லாப விகிதம்.", "முதல் ஆர்டர் CPA வரம்பு = சராசரி ஆர்டர் மதிப்பு × மொத்த லாப விகிதம்.", "அதிகபட்ச CPC = இலக்கு CPA × கன்வெர்ஷன் விகிதம்."], "quiz": [{"q": "மொத்த லாப விகிதம் 25%. பிரேக்-ஈவன் ROAS என்ன?", "options": ["2.5", "4", "25"], "answer": 1, "why": "1 ÷ 0.25 = 4."}, {"q": "இலக்கு CPA ₹800, 5% கிளிக்குகள் கன்வெர்ட் ஆகின்றன. அதிகபட்ச CPC என்ன?", "options": ["₹40", "₹160", "₹16"], "answer": 0, "why": "₹800 × 0.05 = ₹40."}]}, {"title": "ரிடென்ஷன், கோஹார்ட்கள் மற்றும் லைஃப்சைக்கிள்", "minutes": 12, "intro": "கசியும் வளர்ச்சி செலவு மிக்கது. வாடிக்கையாளர்கள் தொடர்ந்து இருக்கிறார்களா என்பதை கோஹார்ட் பகுப்பாய்வு காட்டுகிறது; சரியானவர்கள் திரும்பி வர லைஃப்சைக்கிள் செய்திகள் உதவுகின்றன.", "points": ["கோஹார்ட் என்பது ஒரே காலகட்டத்தில் தொடங்கிய குழு. ஒவ்வொரு கோஹார்ட்டிலும் எத்தனை சதவீதத்தினர் ஒவ்வொரு அடுத்த மாதமும் இன்னும் செயலில் உள்ளனர் என்பதைக் கண்காணியுங்கள்.", "தட்டையாகும் ரிடென்ஷன் வளைவு என்றால், ஒரு மையக் குழு தயாரிப்பைத் தொடர்ந்து பயன்படுத்துகிறது என்று பொருள். பூஜ்யத்தை நோக்கித் தொடர்ந்து விழும் வளைவு என்றால், தயாரிப்பு இன்னும் யாரையும் பிடித்து வைக்கவில்லை என்று பொருள்.", "RFM ஸ்கோரிங் (சமீபத்தன்மை, அடிக்கடி வாங்குதல், செலவழித்த தொகை ஆகியவற்றின் அடிப்படையில் வரிசைப்படுத்தும் முறை), வாடிக்கையாளர்களை recency, frequency, monetary value ஆகியவற்றால் வரிசைப்படுத்துகிறது; இதனால் செய்திகள் அனைவருக்கும் செல்லாமல், அவை பொருந்தும் நபர்களுக்குச் செல்கின்றன."], "example": "ஜனவரியில் சேர்ந்த 1,000 பேரில், மாதம் 1-இல் 600 பேரும், மாதம் 2-இல் 450 பேரும், மாதம் 3-இல் 400 பேரும், மாதம் 4-இல் 390 பேரும் செயலில் உள்ளனர். இழப்பு 150, 50, 10 பேர் என்று குறைகிறது; எனவே வளைவு சுமார் 39%-இல் தட்டையாகிறது: ஒரு மையக் குழு தங்கியிருக்கிறது. விண்-பேக் செய்திகள் முழுப் பட்டியலுக்கும் அல்ல, அடிக்கடி பயன்படுத்தி சமீபத்தில் விலகியவர்களுக்குச் செல்ல வேண்டும்.", "mistake": "எல்லா வாடிக்கையாளர்களுக்கும் ஒரே கலப்பு ரிடென்ஷன் விகிதத்தை அறிக்கையிடுவது. புதிய, பழைய கோஹார்ட்கள் கலந்தால், ரிடென்ஷன் மேம்படுகிறதா மோசமாகிறதா என்பது மறைந்துவிடும்.", "takeaways": ["ரிடென்ஷனை கோஹார்ட் வாரியாகப் படியுங்கள், ஒருபோதும் கலந்து அல்ல.", "வளைவு தட்டையாவது, வாடிக்கையாளர் கையகப்படுத்துதலை விரிவாக்கத் தொடங்குவதற்கான அறிகுறி.", "செய்தி அனுப்பும் முன் பிரித்துப் பாருங்கள் (segment)."], "quiz": [{"q": "தட்டையாகும் ரிடென்ஷன் வளைவு உங்களுக்கு என்ன சொல்கிறது?", "options": ["இறுதியில் எல்லோரும் விலகிவிடுவார்கள்", "ஒரு மையக் குழு தயாரிப்பைத் தொடர்ந்து பயன்படுத்துகிறது", "வாடிக்கையாளர் கையகப்படுத்துதல் நின்றுவிட்டது"], "answer": 1, "why": "தட்டையான வால் பகுதி, மீதமுள்ள வாடிக்கையாளர்கள் மாதந்தோறும் தொடர்ந்து இருக்கிறார்கள் என்பதைக் காட்டுகிறது."}, {"q": "RFM-இல் உள்ள எழுத்துகள் எதைக் குறிக்கின்றன?", "options": ["Reach, frequency, media", "Recency, frequency, monetary value", "Revenue, funnel, margin"], "answer": 1, "why": "வாடிக்கையாளர்கள் எவ்வளவு சமீபத்தில், எவ்வளவு அடிக்கடி, எவ்வளவு வாங்குகிறார்கள் என்பதன் அடிப்படையில் RFM அவர்களை வரிசைப்படுத்துகிறது."}]}, {"title": "ஃபர்ஸ்ட்-பார்ட்டி டேட்டா மற்றும் ஒப்புதல்", "minutes": 10, "intro": "வாடிக்கையாளர்கள் தெளிவான சம்மதத்துடன் நேரடியாக உங்களுக்குத் தரும் தரவு, உங்களிடம் இருக்கக்கூடிய மிகவும் நம்பகமான தரவு; பயன்படுத்தவும் மிகவும் பாதுகாப்பானது.", "points": ["ஃபர்ஸ்ட்-பார்ட்டி டேட்டா என்பது மக்கள் உங்களுடன் நேரடியாகப் பகிர்வது: சைன்-அப்கள், வாங்குதல்கள், விருப்பங்கள், உங்கள் கேள்விகளுக்கான பதில்கள்.", "இந்தியாவின் டிஜிட்டல் தனிப்பட்ட தரவுப் பாதுகாப்புச் சட்டம், 2023, பிரிவு 6(1), ஒப்புதல் 'சுதந்திரமானதாக, குறிப்பிட்டதாக, தெரிவிக்கப்பட்டதாக, நிபந்தனையற்றதாக, தெளிவான உறுதியான செயலுடன் தெளிவானதாக' இருக்க வேண்டும் என்று கோருகிறது (free, specific, informed, unconditional and unambiguous with a clear affirmative action).", "வேலையை முடிக்கத் தேவையான குறைந்தபட்சத் தரவை மட்டும் கேளுங்கள், ஒவ்வொன்றும் எதற்காக என்று சொல்லுங்கள், 'வேண்டாம்' என்று சொல்வதையும் 'சரி' என்று சொல்வது போலவே எளிதாக்குங்கள்."], "example": "ஒரு பாடநெறி தளம் பாடங்களைப் பரிந்துரைக்க விரும்புகிறது. மற்ற இணையதளங்களில் பார்வையாளர்களைக் கண்காணிப்பதற்குப் பதிலாக, சைன்-அப்பில் 'நீங்கள் முதலில் என்ன கற்க விரும்புகிறீர்கள்?' என்ற ஒரே கேள்வியைக் கேட்கிறது; பாடம் குறித்த மின்னஞ்சல்களுக்கு டிக் செய்யப்படாத பெட்டியும் உள்ளது. அந்தப் பதில் முகப்புத் திரையை வடிவமைக்கிறது; மின்னஞ்சல் பட்டியலில் சேர விரும்பியவர்கள் மட்டுமே இருக்கிறார்கள்.", "mistake": "ஏற்கனவே டிக் செய்யப்பட்ட பெட்டிகள், அல்லது தொடர்பில்லாத நோக்கங்களை ஒன்றாக இணைக்கும் ஒரே செக்பாக்ஸ். இவை எதுவும் ஒரு குறிப்பிட்ட நோக்கத்திற்கான தெளிவான உறுதியான செயல் ஆகாது.", "takeaways": ["ஃபர்ஸ்ட்-பார்ட்டி டேட்டா சம்பாதிக்கப்படுவது, பின்னணியில் சேகரிக்கப்படுவது அல்ல.", "ஒப்புதல் ஒரு நோக்கத்திற்குரியது; அது தெளிவான செயலால் வழங்கப்படுகிறது.", "குறைவான தரவு, தெளிவாக விளக்கப்பட்டால், நம்பிக்கையையும் சிறந்த பட்டியல்களையும் உருவாக்கும்."], "quiz": [{"q": "இவற்றில் எது ஃபர்ஸ்ட்-பார்ட்டி டேட்டா?", "options": ["உங்கள் சைன்-அப் படிவத்தில் வாடிக்கையாளர் தரும் பதில்கள்", "டேட்டா புரோக்கரிடமிருந்து வாங்கிய பட்டியல்", "மற்ற இணையதளங்களில் சேகரிக்கப்பட்ட உலாவல் வரலாறு"], "answer": 0, "why": "ஃபர்ஸ்ட்-பார்ட்டி டேட்டாவை வாடிக்கையாளர் உங்களுடன் நேரடியாகப் பகிர்கிறார்."}, {"q": "ஏற்கனவே டிக் செய்யப்பட்ட ஒப்புதல் பெட்டி, தெளிவான உறுதியான செயல் ஆகுமா?", "options": ["ஆம்", "இல்லை"], "answer": 1, "why": "ஏற்கனவே டிக் செய்யப்பட்ட பெட்டி, அந்த நபர் எந்தச் செயலும் செய்ததாகப் பதிவு செய்யாது."}]}]}, "te": {"lang": "te", "langName": "తెలుగు", "ui": {"courseTitle": "అడ్వాన్స్‌డ్ డిజిటల్ మార్కెటింగ్", "courseSub": "మీరు సమర్థించుకోగలిగే సంఖ్యలతో వ్యాపారాన్ని కొలిచి, పెంచడంపై ఆరు పాఠాలు.", "level": "అడ్వాన్స్‌డ్", "minutes": "నిమి", "lesson": "పాఠం", "example": "సాధించిన ఉదాహరణ", "mistake": "సాధారణ తప్పు", "takeaways": "ముఖ్యాంశాలు", "quiz": "మిమ్మల్ని మీరు పరీక్షించుకోండి", "check": "సమాధానం చూడండి", "correct": "సరైనది.", "wrong": "సరిగా లేదు.", "language": "భాష", "contents": "విషయసూచిక", "prev": "మునుపటిది", "next": "తదుపరిది", "note": "ఈ డెమో కోసం ప్రత్యేకంగా రాసిన అసలు కోర్సు ఇది. అనువాదాలు యంత్రం చేసినవి; వీటిని ఇంకా స్థానిక భాషా నిపుణులు సమీక్షించలేదు."}, "modules": [{"title": "యూనిట్ ఎకనామిక్స్: CAC, LTV, పేబ్యాక్", "minutes": 12, "intro": "ఒక కస్టమర్‌ను సంపాదించడానికి ఎంత ఖర్చవుతుందో, ఆ కస్టమర్ విలువ ఎంతో తెలిస్తే ప్రతి మార్కెటింగ్ నిర్ణయం సులభమవుతుంది. ఎక్కువ పని చేసేవి మూడు సంఖ్యలు.", "points": ["కస్టమర్ అక్విజిషన్ కాస్ట్ (CAC, ఒక కొత్త కస్టమర్‌ను సంపాదించడానికి అయ్యే ఖర్చు) అంటే, అదే కాలంలో వచ్చిన కొత్త చెల్లింపు కస్టమర్లతో మార్కెటింగ్ ఖర్చును భాగిస్తే వచ్చే విలువ.", "లైఫ్‌టైమ్ వాల్యూ (LTV, ఒక కస్టమర్ మొత్తం కాలంలో తెచ్చే లాభం) అంటే, కస్టమర్ మీతో ఉన్న మొత్తం కాలంలో తెచ్చే లాభం: నెలవారీ కాంట్రిబ్యూషన్ × ఆశించే నెలల కాలం. నెలవారీ చర్న్ రేటు (కస్టమర్లు వదిలేసే రేటు) స్థిరంగా ఉంటే, ఆశించే కాలం = 1 ÷ ఆ రేటు.", "పేబ్యాక్ పీరియడ్ అంటే CAC ÷ నెలవారీ కాంట్రిబ్యూషన్: కస్టమర్‌ను సంపాదించడానికి అయిన ఖర్చును అతను తిరిగి చెల్లించడానికి ఎన్ని నెలలు పడుతుందో చెప్పే సంఖ్య."], "example": "ఒక లెర్నింగ్ యాప్ ఒక నెలలో ₹2,00,000 ఖర్చు చేసి 400 మంది చెల్లించే సబ్‌స్క్రైబర్లను సంపాదించింది, కాబట్టి CAC ₹500. ప్రతి సబ్‌స్క్రైబర్ నెలకు ₹299 చెల్లిస్తాడు, గ్రాస్ మార్జిన్ 70%, అంటే నెలకు కాంట్రిబ్యూషన్ ₹209.30. నెలవారీ చర్న్ 5%, కాబట్టి ఆశించే కాలం 1 ÷ 0.05 = 20 నెలలు, LTV = ₹209.30 × 20 = ₹4,186. LTV : CAC = 8.37, పేబ్యాక్‌కు ₹500 ÷ ₹209.30 = 2.39 నెలలు పడుతుంది.", "mistake": "LTV లెక్కించడానికి కాంట్రిబ్యూషన్‌కు బదులు రెవెన్యూను వాడటం. రెవెన్యూ కస్టమర్‌కు సేవ అందించే ఖర్చును పట్టించుకోదు, దాంతో ప్రతి ఛానెల్ నిజంకంటే ఎక్కువ లాభదాయకంగా కనిపిస్తుంది.", "takeaways": ["CAC, LTV రెండూ ఒకే కాలాన్ని, ఒకే కస్టమర్లను కవర్ చేయాలి.", "LTV కాంట్రిబ్యూషన్ మీద ఆధారపడాలి, రెవెన్యూ మీద కాదు.", "LTV : CAC బాగున్నా, తక్కువ పేబ్యాక్ పీరియడ్ నగదును కాపాడుతుంది."], "quiz": [{"q": "ఖర్చు ₹1,00,000, దానితో 250 మంది కొత్త చెల్లింపు కస్టమర్లు వచ్చారు. CAC ఎంత?", "options": ["₹250", "₹400", "₹4,000"], "answer": 1, "why": "₹1,00,000 ÷ 250 = ₹400."}, {"q": "నెలవారీ చర్న్ 10%. చర్న్ రేటు స్థిరంగా ఉంటే, కస్టమర్ ఆశించే కాలం ఎంత?", "options": ["10 నెలలు", "12 నెలలు", "100 నెలలు"], "answer": 0, "why": "1 ÷ 0.10 = 10 నెలలు."}]}, {"title": "నిజం చెప్పే ప్రయోగాలు", "minutes": 14, "intro": "A/B టెస్ట్ (ఒకే పేజీ లేదా యాడ్‌లోని రెండు వెర్షన్లను పోల్చే పరీక్ష) దాని డిజైన్ ఎంత బాగుంటే అంతే నమ్మదగినది. ప్రశ్న, మెట్రిక్, శాంపిల్ సైజ్ అన్నీ టెస్ట్ మొదలయ్యే ముందే నిర్ణయించండి, నడుస్తున్నప్పుడు కాదు.", "points": ["ముందుగానే ఒక ప్రధాన మెట్రిక్‌ను ఎంచుకోండి. తర్వాత చాలా మెట్రిక్‌లను చూస్తే యాదృచ్ఛికంగానే ఒక 'విజేత' కనిపిస్తుంది.", "బేస్‌లైన్ రేటు, గుర్తించదగిన అతి చిన్న మార్పు, సిగ్నిఫికెన్స్ లెవెల్, మీకు కావలసిన పవర్ నుంచి శాంపిల్ సైజ్‌ను లెక్కించండి.", "ఫలితం సిగ్నిఫికెంట్‌గా కనిపించిన క్షణమే టెస్ట్‌ను ఆపకండి. పదేపదే తొంగిచూస్తే మీరు ఎంచుకున్న స్థాయి కంటే ఫాల్స్-పాజిటివ్ రేటు పెరుగుతుంది.", "స్ప్లిట్‌ను తనిఖీ చేయండి: 50/50 అనుకున్నారు, కానీ గ్రూపులు స్పష్టంగా అసమానంగా ఉంటే, కేటాయింపులో తప్పు ఉంది, ఫలితాన్ని నమ్మలేం."], "example": "ఒక సైన్-అప్ పేజీ 4% కన్వర్ట్ అవుతోంది. 5% సిగ్నిఫికెన్స్ లెవెల్ (టూ-సైడెడ్), 80% పవర్‌తో అది 5%కి పెరగడాన్ని గుర్తించాలనుకుంటున్నారు. రెండు ప్రొపోర్షన్‌ల కోసం ప్రామాణిక ఫార్ములా వాడితే, n = (1.96 + 0.8416)² × (0.04 × 0.96 + 0.05 × 0.95) ÷ 0.01² ≈ 6,742.2. అంటే ఫలితం చూసే ముందు ప్రతి గ్రూపులో 6,743 మంది విజిటర్లు, మొత్తం 13,486 మంది కావాలి.", "mistake": "నిర్ణీత సంఖ్యలో విజిటర్ల బదులు నిర్ణీత రోజుల పాటు టెస్ట్ నడపడం, ఆపై గ్రాఫ్ బాగా కనిపించిందని ముందే ఆపేయడం.", "takeaways": ["లాంచ్‌కు ముందే ఎంచుకున్న ఒకే ఒక ప్రధాన మెట్రిక్.", "శాంపిల్ సైజ్‌ను లెక్కించాలి, ఊహించకూడదు.", "అసమాన స్ప్లిట్ సరిచేయాల్సిన బగ్, ఫలితంగా చెప్పేది కాదు."], "quiz": [{"q": "ప్రతిరోజూ ఫలితాలు చూసి, మొదటి సిగ్నిఫికెంట్ రీడింగ్ వద్దే ఆపడం ఎందుకు సమస్య?", "options": ["టెస్ట్ నెమ్మదిస్తుంది", "ఫాల్స్ పాజిటివ్ వచ్చే అవకాశం పెరుగుతుంది", "కన్వర్షన్ రేటు తగ్గుతుంది"], "answer": 1, "why": "ప్రతి సారి చూడటం అంటే యాదృచ్ఛిక నాయిస్ థ్రెషోల్డ్ దాటడానికి మరొక అవకాశం."}, {"q": "మీరు 50/50 స్ప్లిట్ అనుకున్నారు, కానీ 58%, 42% వచ్చింది. ఏం చేయాలి?", "options": ["ఏదేమైనా విజేతను ప్రకటించాలి", "ఫలితాన్ని నమ్మే ముందు కేటాయింపును పరిశీలించాలి", "ట్రాఫిక్‌ను రెట్టింపు చేయాలి"], "answer": 1, "why": "స్పష్టంగా అసమానమైన స్ప్లిట్ కేటాయింపు పాడైందని సూచిస్తుంది, అది ఫలితాన్ని పక్షపాతంగా మార్చవచ్చు."}]}, {"title": "అట్రిబ్యూషన్ vs ఇంక్రిమెంటాలిటీ", "minutes": 13, "intro": "కొనుగోలుదారు ఏ యాడ్‌లను చూశాడో అట్రిబ్యూషన్ చెబుతుంది. యాడ్‌లు లేకపోతే జరగని అమ్మకాలు ఏవో ఇంక్రిమెంటాలిటీ చెబుతుంది. ఖర్చు ఫలితం ఇచ్చిందో లేదో రెండోది మాత్రమే చెబుతుంది.", "points": ["ప్లాట్‌ఫాం రిపోర్టులు యాడ్ తర్వాత జరిగిన కన్వర్షన్‌లన్నింటినీ లెక్కిస్తాయి, ఎలాగూ కొనేవాళ్లను కూడా కలిపి.", "హోల్డ్‌అవుట్ టెస్ట్‌లో ఒక యాదృచ్ఛిక గ్రూపుకు క్యాంపెయిన్ చూపించరు. రెండు గ్రూపుల కన్వర్షన్ రేటు తేడానే క్యాంపెయిన్ అసలు ప్రభావం.", "ఇంక్రిమెంటల్ CPA (CPA అంటే ఒక కన్వర్షన్‌కు అయ్యే ఖర్చు) = ఖర్చు ÷ ఇంక్రిమెంటల్ కన్వర్షన్లు. ఇది సాధారణంగా ప్లాట్‌ఫాం చూపే CPA కంటే ఎక్కువ ఉంటుంది."], "example": "ఒక క్యాంపెయిన్ 9,00,000 మందికి చేరుతుంది, యాదృచ్ఛికంగా ఎంచిన 1,00,000 మందిని హోల్డ్‌అవుట్‌గా ఉంచారు. యాడ్ చూసిన గ్రూప్ 3.0% (27,000 కన్వర్షన్లు), హోల్డ్‌అవుట్ 2.6% (2,600) కన్వర్ట్ అయ్యాయి. లిఫ్ట్ = (3.0 − 2.6) ÷ 2.6 = 15.4%, ఇంక్రిమెంటల్ కన్వర్షన్లు = (0.030 − 0.026) × 9,00,000 = 3,600. ప్లాట్‌ఫాం 9,000 కన్వర్షన్లు అని చెప్పింది, కాబట్టి వాటిలో 40% మాత్రమే ఇంక్రిమెంటల్. ₹18,00,000 ఖర్చుపై, రిపోర్ట్ చేసిన CPA ₹200 ఇంక్రిమెంటల్ CPA ₹500 అవుతుంది.", "mistake": "యాదృచ్ఛిక కేటాయింపు లేకుండా, యాడ్ చూసిన వారిని చూడని వారితో పోల్చడం. యాడ్ కాకుండా ఆ రెండు గ్రూపులు అనేక విధాలుగా వేరుగా ఉంటాయి.", "takeaways": ["అట్రిబ్యూట్ అయిన కన్వర్షన్లు యాడ్ వల్లే జరిగినవి కావు.", "యాదృచ్ఛిక హోల్డ్‌అవుట్‌లు నిజమైన ప్రభావాన్ని కొలుస్తాయి.", "ఛానెల్‌లను ఇంక్రిమెంటల్ CPA ఆధారంగా అంచనా వేయండి."], "quiz": [{"q": "హోల్డ్‌అవుట్ గ్రూప్‌ను న్యాయమైన పోలికగా మార్చేది ఏమిటి?", "options": ["దాన్ని యాదృచ్ఛికంగా ఎంచుకోవడం", "అందులో మీ ఉత్తమ కస్టమర్లు ఉండటం", "అది యాడ్ చూసిన గ్రూప్ సైజ్‌లోనే ఉండటం"], "answer": 0, "why": "యాదృచ్ఛిక కేటాయింపు వల్ల క్యాంపెయిన్ తప్ప మిగతా అన్నిటిలో రెండు గ్రూపులు ఒకేలా ఉంటాయి."}, {"q": "ఖర్చు ₹50,000, టెస్ట్‌లో 100 ఇంక్రిమెంటల్ కన్వర్షన్లు వచ్చాయి. ఇంక్రిమెంటల్ CPA ఎంత?", "options": ["₹50", "₹500", "₹5,000"], "answer": 1, "why": "₹50,000 ÷ 100 = ₹500."}]}, {"title": "మీ సొంత సంఖ్యల నుంచి బిడ్డింగ్", "minutes": 11, "intro": "ఆటోమేటెడ్ బిడ్డింగ్‌కు అలవాటు నుంచి కాకుండా, మీ ఆర్థిక లెక్కల నుంచి వచ్చిన లక్ష్యాలు ఇస్తే అది ఉత్తమంగా పనిచేస్తుంది.", "points": ["బ్రేక్-ఈవెన్ ROAS (ROAS అంటే యాడ్ ఖర్చుపై వచ్చిన రెవెన్యూ నిష్పత్తి) = 1 ÷ మీ గ్రాస్ మార్జిన్. అంతకంటే తక్కువైతే, యాడ్‌ల నుంచి వచ్చే ప్రతి అమ్మకం ఇతర ఖర్చులకు ముందే నష్టాన్ని తెస్తుంది.", "మొదటి ఆర్డర్‌పై మీరు భరించగల అత్యధిక CPA (ఒక కన్వర్షన్‌కు అయ్యే ఖర్చు) ఆ ఆర్డర్ కాంట్రిబ్యూషనే: సగటు ఆర్డర్ విలువ × గ్రాస్ మార్జిన్. రిపీట్ కొనుగోళ్లు నమ్మదగినవైనప్పుడు మాత్రమే దాని బదులు LTV వాడండి.", "గరిష్ఠ కాస్ట్ పర్ క్లిక్ (CPC, ఒక క్లిక్‌కు అయ్యే ఖర్చు) = టార్గెట్ CPA × ఆ క్లిక్‌ల కన్వర్షన్ రేటు."], "example": "ఒక షాప్ గ్రాస్ మార్జిన్ 40%, కాబట్టి బ్రేక్-ఈవెన్ ROAS = 1 ÷ 0.40 = 2.5: బ్రేక్ ఈవెన్ కావడానికే యాడ్‌పై ఖర్చు చేసే ప్రతి ₹1కి ₹2.50 రెవెన్యూ రావాలి. సగటు ఆర్డర్ ₹2,000 అయితే, మొదటి ఆర్డర్‌పై బ్రేక్-ఈవెన్ CPA = ₹2,000 × 0.40 = ₹800. మీరు ₹500 CPA లక్ష్యంగా పెట్టుకుని, 2% క్లిక్‌లు కన్వర్ట్ అయితే, క్లిక్‌కు గరిష్ఠంగా ₹500 × 0.02 = ₹10 చెల్లించవచ్చు.", "mistake": "పోటీదారు సంఖ్య నుంచి లేదా ఇండస్ట్రీ సగటు నుంచి టార్గెట్ ROAS పెట్టడం. మీరు ఎంత చెల్లించగలరో నిర్ణయించేది వారి మార్జిన్ కాదు, మీ మార్జిన్.", "takeaways": ["బ్రేక్-ఈవెన్ ROAS = 1 ÷ గ్రాస్ మార్జిన్.", "మొదటి ఆర్డర్ CPA పరిమితి = సగటు ఆర్డర్ విలువ × గ్రాస్ మార్జిన్.", "గరిష్ఠ CPC = టార్గెట్ CPA × కన్వర్షన్ రేటు."], "quiz": [{"q": "గ్రాస్ మార్జిన్ 25%. బ్రేక్-ఈవెన్ ROAS ఎంత?", "options": ["2.5", "4", "25"], "answer": 1, "why": "1 ÷ 0.25 = 4."}, {"q": "టార్గెట్ CPA ₹800, 5% క్లిక్‌లు కన్వర్ట్ అవుతాయి. గరిష్ఠ CPC ఎంత?", "options": ["₹40", "₹160", "₹16"], "answer": 0, "why": "₹800 × 0.05 = ₹40."}]}, {"title": "రిటెన్షన్, కోహార్ట్‌లు, లైఫ్‌సైకిల్", "minutes": 12, "intro": "లీక్ అవుతున్న గ్రోత్ ఖరీదైనది. కస్టమర్లు కొనసాగుతున్నారో లేదో కోహార్ట్ విశ్లేషణ చూపిస్తుంది, సరైన వారు తిరిగి రావడానికి లైఫ్‌సైకిల్ మెసేజ్‌లు సహాయపడతాయి.", "points": ["కోహార్ట్ అంటే ఒకే కాలంలో మొదలుపెట్టిన గ్రూప్. ప్రతి కోహార్ట్‌లో తర్వాతి ప్రతి నెలలో ఇంకా యాక్టివ్‌గా ఉన్నవారి వాటాను గమనించండి.", "రిటెన్షన్ కర్వ్ చదునుగా మారితే, ఒక కోర్ గ్రూప్ ప్రొడక్ట్‌ను వాడుతూనే ఉందని అర్థం. కర్వ్ సున్నా వైపు పడిపోతూనే ఉంటే, ప్రొడక్ట్ ఇంకా ఎవరినీ నిలుపుకోలేకపోతోందని అర్థం.", "RFM స్కోరింగ్ (రీసెన్సీ, ఫ్రీక్వెన్సీ, మానిటరీ వాల్యూ: ఎప్పుడు కొన్నారు, ఎంత తరచుగా కొంటారు, ఎంత ఖర్చు చేస్తారు) కస్టమర్లను ర్యాంక్ చేస్తుంది, తద్వారా మెసేజ్‌లు అందరికీ కాకుండా వాటికి సరిపోయే వారికి వెళ్తాయి."], "example": "జనవరిలో చేరిన 1,000 మందిలో 1వ నెలలో 600, 2వ నెలలో 450, 3వ నెలలో 400, 4వ నెలలో 390 మంది యాక్టివ్‌గా ఉన్నారు. తగ్గుదల 150 నుంచి 50కి, 10కి తగ్గుతోంది, కాబట్టి కర్వ్ సుమారు 39% వద్ద చదునవుతోంది: ఒక కోర్ గ్రూప్ ఉండిపోతోంది. విన్-బ్యాక్ మెసేజ్‌లు మొత్తం లిస్ట్‌కు కాకుండా, తరచుగా వాడిన, ఇటీవల వదిలేసిన వారికి వెళ్ళాలి.", "mistake": "కస్టమర్లందరికీ కలిపి ఒకే రిటెన్షన్ రేటు చెప్పడం. కొత్త, పాత కోహార్ట్‌లను కలిపేస్తే రిటెన్షన్ మెరుగవుతోందో, క్షీణిస్తోందో కనబడదు.", "takeaways": ["రిటెన్షన్‌ను కోహార్ట్ వారీగా చదవండి, ఎప్పుడూ కలిపి కాదు.", "చదునవుతున్న కర్వ్, అక్విజిషన్‌ను పెంచడం మొదలుపెట్టడానికి సంకేతం.", "మెసేజ్ చేసే ముందు సెగ్మెంట్ చేయండి."], "quiz": [{"q": "చదునవుతున్న రిటెన్షన్ కర్వ్ మీకు ఏమి చెబుతుంది?", "options": ["చివరికి అందరూ వెళ్లిపోతారు", "ఒక కోర్ గ్రూప్ ప్రొడక్ట్‌ను వాడుతూనే ఉంది", "అక్విజిషన్ ఆగిపోయింది"], "answer": 1, "why": "చదునైన తోక అంటే మిగిలిన కస్టమర్లు నెలనెలా కొనసాగుతున్నారని అర్థం."}, {"q": "RFMలోని అక్షరాలకు అర్థం ఏమిటి?", "options": ["రీచ్, ఫ్రీక్వెన్సీ, మీడియా", "రీసెన్సీ, ఫ్రీక్వెన్సీ, మానిటరీ వాల్యూ", "రెవెన్యూ, ఫన్నెల్, మార్జిన్"], "answer": 1, "why": "RFM కస్టమర్లను ఎంత ఇటీవల, ఎంత తరచుగా, ఎంత ఎక్కువ కొంటారనే దాని ఆధారంగా ర్యాంక్ చేస్తుంది."}]}, {"title": "ఫస్ట్-పార్టీ డేటా, సమ్మతి", "minutes": 10, "intro": "కస్టమర్లు స్పష్టమైన అంగీకారంతో నేరుగా మీకు ఇచ్చే డేటా మీకు ఉండే అత్యంత నమ్మదగిన డేటా, వాడటానికి అత్యంత సురక్షితమైనది కూడా.", "points": ["ఫస్ట్-పార్టీ డేటా అంటే ప్రజలు నేరుగా మీతో పంచుకునేది: సైన్-అప్‌లు, కొనుగోళ్లు, ఇష్టాయిష్టాలు, మీ ప్రశ్నలకు ఇచ్చే సమాధానాలు.", "భారతదేశ డిజిటల్ పర్సనల్ డేటా ప్రొటెక్షన్ చట్టం, 2023, సెక్షన్ 6(1) ప్రకారం సమ్మతి 'స్వేచ్ఛగా, నిర్దిష్టంగా, తెలుసుకుని ఇచ్చినదిగా, షరతులు లేనిదిగా, స్పష్టమైన అంగీకార చర్యతో నిస్సందేహంగా' ఉండాలి ('free, specific, informed, unconditional and unambiguous with a clear affirmative action').", "పనికి సరిపోయే కనీస డేటానే అడగండి, ప్రతి అంశం దేనికో చెప్పండి, వద్దు అనడాన్ని అవును అనడమంత సులభంగా చేయండి."], "example": "ఒక కోర్స్ ప్లాట్‌ఫాం పాఠాలను సిఫార్సు చేయాలనుకుంటోంది. ఇతర వెబ్‌సైట్లలో విజిటర్లను ట్రాక్ చేయడానికి బదులు, సైన్-అప్ దగ్గర 'మీరు మొదట ఏం నేర్చుకోవాలనుకుంటున్నారు?' అనే ఒక ప్రశ్న అడుగుతుంది, పాఠాల ఈమెయిల్‌ల కోసం టిక్ చేయని బాక్స్‌తో. ఆ సమాధానం హోమ్ స్క్రీన్‌ను తీర్చిదిద్దుతుంది, ఈమెయిల్ లిస్ట్‌లో చేరడానికి ఎంచుకున్నవారు మాత్రమే ఉంటారు.", "mistake": "ముందే టిక్ చేసిన బాక్స్‌లు, లేదా సంబంధం లేని ఉద్దేశాలను కలిపే ఒకే చెక్‌బాక్స్. ఈ రెండూ నిర్దిష్ట ఉద్దేశం కోసం స్పష్టమైన అంగీకార చర్య కావు.", "takeaways": ["ఫస్ట్-పార్టీ డేటా సంపాదించేది, బ్యాక్‌గ్రౌండ్‌లో సేకరించేది కాదు.", "సమ్మతి ఒక ఉద్దేశానికి నిర్దిష్టంగా ఉండి, స్పష్టమైన చర్య ద్వారా ఇవ్వాలి.", "తక్కువ డేటా, స్పష్టంగా వివరించడం, నమ్మకాన్ని, మెరుగైన లిస్ట్‌లను నిర్మిస్తుంది."], "quiz": [{"q": "వీటిలో ఏది ఫస్ట్-పార్టీ డేటా?", "options": ["మీ సైన్-అప్ ఫారమ్‌లో కస్టమర్ ఇచ్చే సమాధానాలు", "డేటా బ్రోకర్ నుంచి కొన్న లిస్ట్", "ఇతర వెబ్‌సైట్లలో సేకరించిన బ్రౌజింగ్ హిస్టరీ"], "answer": 0, "why": "ఫస్ట్-పార్టీ డేటాను కస్టమర్ నేరుగా మీతో పంచుకుంటారు."}, {"q": "ముందే టిక్ చేసిన సమ్మతి బాక్స్ స్పష్టమైన అంగీకార చర్యా?", "options": ["అవును", "కాదు"], "answer": 1, "why": "ఇప్పటికే టిక్ చేసి ఉన్న బాక్స్ ఆ వ్యక్తి ఏ చర్యా చేయలేదని సూచిస్తుంది."}]}]}, "ml": {"lang": "ml", "langName": "മലയാളം", "ui": {"courseTitle": "അഡ്വാൻസ്ഡ് ഡിജിറ്റൽ മാർക്കറ്റിംഗ്", "courseSub": "നിങ്ങൾക്ക് ന്യായീകരിക്കാവുന്ന കണക്കുകൾ ഉപയോഗിച്ച് ഒരു ബിസിനസ് അളക്കാനും വളർത്താനും ആറ് പാഠങ്ങൾ.", "level": "അഡ്വാൻസ്ഡ്", "minutes": "മിനിറ്റ്", "lesson": "പാഠം", "example": "ഉദാഹരണം (കണക്കുസഹിതം)", "mistake": "സാധാരണ തെറ്റ്", "takeaways": "പ്രധാന പാഠങ്ങൾ", "quiz": "സ്വയം പരിശോധിക്കുക", "check": "ഉത്തരം പരിശോധിക്കുക", "correct": "ശരിയാണ്.", "wrong": "ശരിയായില്ല.", "language": "ഭാഷ", "contents": "ഉള്ളടക്കം", "prev": "മുമ്പത്തേത്", "next": "അടുത്തത്", "note": "ഈ ഡെമോയ്ക്കായി എഴുതിയ യഥാർഥ കോഴ്സ്. വിവർത്തനങ്ങൾ മെഷീൻ ചെയ്തതാണ്; മാതൃഭാഷക്കാർ ഇതുവരെ പരിശോധിച്ചിട്ടില്ല."}, "modules": [{"title": "യൂണിറ്റ് ഇക്കണോമിക്സ്: CAC, LTV, പേബാക്ക്", "minutes": 12, "intro": "ഒരു ഉപഭോക്താവിനെ നേടാൻ എത്ര ചെലവാകുമെന്നും ആ ഉപഭോക്താവിന് എത്ര മൂല്യമുണ്ടെന്നും അറിഞ്ഞാൽ ഓരോ മാർക്കറ്റിംഗ് തീരുമാനവും എളുപ്പമാകും. മൂന്ന് സംഖ്യകളാണ് മിക്ക ജോലിയും ചെയ്യുന്നത്.", "points": ["CAC (Customer Acquisition Cost, ഒരു പുതിയ ഉപഭോക്താവിനെ നേടാനുള്ള ചെലവ്) എന്നാൽ മാർക്കറ്റിംഗിന് ചെലവാക്കിയ തുകയെ, അതേ കാലയളവിൽ കിട്ടിയ പുതിയ പണം നൽകുന്ന ഉപഭോക്താക്കളുടെ എണ്ണം കൊണ്ട് ഹരിച്ചത്.", "LTV (Lifetime Value, ഒരു ഉപഭോക്താവിൽനിന്ന് ജീവിതകാലം മുഴുവൻ കിട്ടുന്ന ലാഭം) എന്നാൽ നിങ്ങളുമായുള്ള ബന്ധത്തിലുടനീളം ആ ഉപഭോക്താവ് നൽകുന്ന ലാഭം: പ്രതിമാസ കോൺട്രിബ്യൂഷനെ പ്രതീക്ഷിക്കുന്ന ആയുസ്സ് (മാസങ്ങളിൽ) കൊണ്ട് ഗുണിച്ചത്. പ്രതിമാസ ചേൺ നിരക്ക് സ്ഥിരമാണെങ്കിൽ പ്രതീക്ഷിക്കുന്ന ആയുസ്സ് 1 ÷ ആ നിരക്ക് ആണ്.", "പേബാക്ക് കാലയളവ് എന്നാൽ CAC യെ പ്രതിമാസ കോൺട്രിബ്യൂഷൻ കൊണ്ട് ഹരിച്ചത്: ഒരു ഉപഭോക്താവിനെ നേടാൻ ചെലവായ തുക അയാൾ തിരിച്ചു നൽകാൻ എത്ര മാസം എടുക്കും എന്നതാണ് ഇത്."], "example": "ഒരു ലേണിംഗ് ആപ്പ് ഒരു മാസം ₹2,00,000 ചെലവാക്കി 400 പണം നൽകുന്ന സബ്സ്ക്രൈബർമാരെ നേടുന്നു, അതിനാൽ CAC ₹500 ആണ്. ഓരോ സബ്സ്ക്രൈബറും മാസം ₹299 നൽകുന്നു, 70% ഗ്രോസ് മാർജിനിൽ, അതായത് മാസം ₹209.30 കോൺട്രിബ്യൂഷൻ. പ്രതിമാസ ചേൺ 5% ആയതിനാൽ പ്രതീക്ഷിക്കുന്ന ആയുസ്സ് 1 ÷ 0.05 = 20 മാസം, LTV ₹209.30 × 20 = ₹4,186. LTV ഉം CAC യും തമ്മിലുള്ള അനുപാതം 8.37 ആണ്, പേബാക്കിന് ₹500 ÷ ₹209.30 = 2.39 മാസം വേണം.", "mistake": "LTV കണക്കാക്കാൻ കോൺട്രിബ്യൂഷന് പകരം വരുമാനം (revenue) ഉപയോഗിക്കുന്നത്. വരുമാനം ഉപഭോക്താവിന് സേവനം നൽകാനുള്ള ചെലവ് അവഗണിക്കുന്നതിനാൽ ഓരോ ചാനലും യഥാർഥത്തിലുള്ളതിലും കൂടുതൽ ലാഭകരമായി തോന്നിക്കും.", "takeaways": ["CAC യും LTV യും ഒരേ കാലയളവും ഒരേ ഉപഭോക്താക്കളും ഉൾക്കൊള്ളണം.", "LTV കോൺട്രിബ്യൂഷനെ അടിസ്ഥാനമാക്കിയാണ്, വരുമാനത്തെയല്ല.", "LTV ഉം CAC യും തമ്മിലുള്ള അനുപാതം നല്ലതായി തോന്നിയാലും, ചെറിയ പേബാക്ക് കാലയളവ് കയ്യിലെ പണത്തെ സംരക്ഷിക്കുന്നു."], "quiz": [{"q": "ചെലവ് ₹1,00,000 ആണ്, അത് 250 പുതിയ പണം നൽകുന്ന ഉപഭോക്താക്കളെ കൊണ്ടുവരുന്നു. CAC എത്ര?", "options": ["₹250", "₹400", "₹4,000"], "answer": 1, "why": "₹1,00,000 ÷ 250 = ₹400."}, {"q": "പ്രതിമാസ ചേൺ 10% ആണ്. ചേൺ നിരക്ക് സ്ഥിരമാണെങ്കിൽ, ഉപഭോക്താവിന്റെ പ്രതീക്ഷിക്കുന്ന ആയുസ്സ് എത്ര?", "options": ["10 മാസം", "12 മാസം", "100 മാസം"], "answer": 0, "why": "1 ÷ 0.10 = 10 മാസം."}]}, {"title": "സത്യം പറയുന്ന പരീക്ഷണങ്ങൾ", "minutes": 14, "intro": "ഒരു A/B ടെസ്റ്റ് (ഒരേ കാര്യത്തിന്റെ രണ്ട് പതിപ്പുകൾ താരതമ്യം ചെയ്യുന്ന പരീക്ഷണം) അതിന്റെ രൂപകൽപ്പനയോളം മാത്രമേ നല്ലതാകൂ. ചോദ്യം, മെട്രിക്, സാമ്പിൾ വലുപ്പം എന്നിവ ടെസ്റ്റ് തുടങ്ങുംമുമ്പ് തീരുമാനിക്കുക, ടെസ്റ്റ് നടക്കുമ്പോഴല്ല.", "points": ["ഒരു പ്രധാന മെട്രിക് മുൻകൂട്ടി തിരഞ്ഞെടുക്കുക. പിന്നീട് പല മെട്രിക്കുകൾ നോക്കിയാൽ യാദൃച്ഛികമായി ഒരു 'വിജയി' ഉണ്ടാകും.", "ബേസ്‌ലൈൻ നിരക്ക്, കണ്ടെത്താൻ വിലയുള്ള ഏറ്റവും ചെറിയ മാറ്റം, സിഗ്നിഫിക്കൻസ് ലെവൽ, നിങ്ങൾക്ക് വേണ്ട പവർ എന്നിവയിൽനിന്ന് സാമ്പിൾ വലുപ്പം കണക്കാക്കുക.", "ഫലം സിഗ്നിഫിക്കന്റ് ആയി തോന്നുന്ന നിമിഷം ടെസ്റ്റ് നിർത്തരുത്. ആവർത്തിച്ച് എത്തിനോക്കുന്നത് നിങ്ങൾ തിരഞ്ഞെടുത്ത നിലയെക്കാൾ ഫാൾസ്-പോസിറ്റീവ് നിരക്ക് ഉയർത്തുന്ന ഔട്ട് ടെസ്റ്റ് ഒരു റാൻഡം ഗ്രൂപ്പിനെ കാമ്പെയ്ൻ കാണിക്കാതെ മാറ്റിനിർത്തുന്നു. ഗ്രൂപ്പുകൾ തമ്മിലുള്ള കൺവേർഷൻ നിരക്കിലെ വ്യത്യാസമാണ് കാമ്പെയ്‌നിന്റെ യഥാർഥ ഫലം.", "ഇൻക്രിമെന്റൽ CPA (Cost Per Acquisition, ഒരു കൺവേർഷന് ആകുന്ന ചെലവ്) എന്നാൽ ചെലവിനെ ഇൻക്രിമെന്റൽ കൺവേർഷനുകൾ കൊണ്ട് ഹരിച്ചത്. ഇത് സാധാരണയായി പ്ലാറ്റ്ഫോം റിപ്പോർട്ട് ചെയ്യുന്ന CPA യെക്കാൾ കൂടുതലായിരിക്കും."], "example": "ഒരു കാമ്പെയ്ൻ 9,00,000 പേരിലെത്തുന്നു, റാൻഡമായി 1,00,000 പേരെ ഹോൾഡ്ഔട്ടായി മാറ്റിനിർത്തി. പരസ്യം കണ്ട ഗ്രൂപ്പ് 3.0% നിരക്കിലും (27,000 കൺവേർഷനുകൾ) ഹോൾഡ്ഔട്ട് 2.6% നിരക്കിലും (2,600) കൺവേർട്ട് ചെയ്യുന്നു. ലിഫ്റ്റ് (3.0 − 2.6) ÷ 2.6 = 15.4% ആണ്, ഇൻക്രിമെന്റൽ കൺവേർഷനുകൾ (0.030 − 0.026) × 9,00,000 = 3,600. പ്ലാറ്റ്ഫോം 9,000 കൺവേർഷനുകൾ അവകാശപ്പെട്ടു, അതിനാൽ അവയിൽ 40% മാത്രമേ ഇൻക്രിമെന്റൽ ആയിരുന്നുള്ളൂ. ₹18,00,000 ചെലവിൽ, റിപ്പോർട്ട് ചെയ്ത ₹200 CPA ഇൻക്രിമെന്റൽ CPA ₹500 ആയി മാറുന്നു.", "mistake": "റാൻഡം അസൈൻമെന്റ് ഇല്ലാതെ പരസ്യം കണ്ടവരെയും കാണാത്തവരെയും താരതമ്യം ചെയ്യുന്നത്. ആ ഗ്രൂപ്പുകൾ പരസ്യത്തിനു പുറമെ പല കാര്യങ്ങളിലും വ്യത്യസ്തരാണ്.", "takeaways": ["ആട്രിബ്യൂട്ട് ചെയ്ത കൺവേർഷനുകൾ ഉണ്ടാക്കിയ കൺവേർഷനുകളല്ല.", "റാൻഡം ഹോൾഡ്ഔട്ടുകൾ യഥാർഥ ഫലം അളക്കുന്നു.", "ചാനലുകളെ ഇൻക്രിമെന്റൽ CPA വച്ച് വിലയിരുത്തുക."], "quiz": [{"q": "ഹോൾഡ്ഔട്ട് ഗ്രൂപ്പിനെ ന്യായമായ താരതമ്യമാക്കുന്നത് എന്താണ്?", "options": ["അത് റാൻഡമായി തിരഞ്ഞെടുത്തതാണ്", "അതിൽ നിങ്ങളുടെ ഏറ്റവും നല്ല ഉപഭോക്താക്കളുണ്ട്", "അത് പരസ്യം കണ്ട ഗ്രൂപ്പിന്റെ അതേ വലുപ്പമാണ്"], "answer": 0, "why": "റാൻഡം അസൈൻമെന്റ് കാമ്പെയ്ൻ ഒഴികെ മറ്റെല്ലാ കാര്യത്തിലും ഗ്രൂപ്പുകളെ സമാനമാക്കുന്നു."}, {"q": "ചെലവ് ₹50,000 ആണ്, ടെസ്റ്റ് 100 ഇൻക്രിമെന്റൽ കൺവേർഷനുകൾ കാണിക്കുന്നു. ഇൻക്രിമെന്റൽ CPA എത്ര?", "options": ["₹50", "₹500", "₹5,000"], "answer": 1, "why": "₹50,000 ÷ 100 = ₹500."}]}, {"title": "നിങ്ങളുടെ സ്വന്തം കണക്കുകളിൽനിന്ന് ബിഡ്ഡിംഗ്", "minutes": 11, "intro": "ശീലത്തിൽനിന്നല്ല, നിങ്ങളുടെ സാമ്പത്തിക കണക്കുകളിൽനിന്ന് വരുന്ന ടാർഗെറ്റുകൾ നൽകുമ്പോഴാണ് ഓട്ടോമേറ്റഡ് ബിഡ്ഡിംഗ് ഏറ്റവും നന്നായി പ്രവർത്തിക്കുന്നത്.", "points": ["ബ്രേക്ക്-ഈവൻ ROAS (Return On Ad Spend, പരസ്യത്തിന് ചെലവാക്കിയ ഓരോ രൂപയ്ക്കും കിട്ടുന്ന വരുമാനം) എന്നാൽ 1 ÷ നിങ്ങളുടെ ഗ്രോസ് മാർജിൻ. ഇതിൽ താഴെയായാൽ, മറ്റൊരു ചെലവും വരുംമുമ്പുതന്നെ പരസ്യങ്ങളിൽനിന്നുള്ള ഓരോ വിൽപ്പനയും നഷ്ടമാണ്.", "ആദ്യ ഓർഡറിൽ താങ്ങാവുന്ന ഏറ്റവും ഉയർന്ന CPA (Cost Per Acquisition, ഒരു കൺവേർഷന് ആകുന്ന ചെലവ്) ആ ഓർഡറിന്റെ കോൺട്രിബ്യൂഷനാണ്: ശരാശരി ഓർഡർ മൂല്യം × ഗ്രോസ് മാർജിൻ. ആവർത്തന വാങ്ങലുകൾ വിശ്വസനീയമാണെങ്കിൽ മാത്രം പകരം LTV ഉപയോഗിക്കുക.", "പരമാവധി CPC (Cost Per Click, ഒരു ക്ലിക്കിനുള്ള ചെലവ്) ടാർഗെറ്റ് CPA × ആ ക്ലിക്കുകളുടെ കൺവേർഷൻ നിരക്ക് എന്നതിൽനിന്ന് ലഭിക്കും."], "example": "ഒരു കടയുടെ ഗ്രോസ് മാർജിൻ 40% ആണ്, അതിനാൽ ബ്രേക്ക്-ഈവൻ ROAS 1 ÷ 0.40 = 2.5 ആണ്: പരസ്യത്തിന് ചെലവാക്കുന്ന ഓരോ ₹1 ഉം ബ്രേക്ക്-ഈവൻ ആകാൻതന്നെ ₹2.50 വരുമാനം കൊണ്ടുവരണം. ശരാശരി ഓർഡർ ₹2,000 ആയാൽ, ആദ്യ ഓർഡറിലെ ബ്രേക്ക്-ഈവൻ CPA ₹2,000 × 0.40 = ₹800 ആണ്. നിങ്ങൾ ₹500 CPA ലക്ഷ്യമിടുകയും 2% ക്ലിക്കുകൾ കൺവേർട്ട് ചെയ്യുകയും ചെയ്താൽ, ഒരു ക്ലിക്കിന് ₹500 × 0.02 = ₹10 വരെ നൽകാം.", "mistake": "ഒരു എതിരാളിയുടെ കണക്കോ വ്യവസായത്തിന്റെ ശരാശരിയോ നോക്കി ടാർഗെറ്റ് ROAS നിശ്ചയിക്കുന്നത്. നിങ്ങൾക്ക് എത്ര നൽകാമെന്ന് തീരുമാനിക്കുന്നത് അവരുടെ മാർജിനല്ല, നിങ്ങളുടെ മാർജിനാണ്.", "takeaways": ["ബ്രേക്ക്-ഈവൻ ROAS = 1 ÷ ഗ്രോസ് മാർജിൻ.", "ആദ്യ ഓർഡർ CPA പരിധി = ശരാശരി ഓർഡർ മൂല്യം × ഗ്രോസ് മാർജിൻ.", "പരമാവധി CPC = ടാർഗെറ്റ് CPA × കൺവേർഷൻ നിരക്ക്."], "quiz": [{"q": "ഗ്രോസ് മാർജിൻ 25% ആണ്. ബ്രേക്ക്-ഈവൻ ROAS എത്ര?", "options": ["2.5", "4", "25"], "answer": 1, "why": "1 ÷ 0.25 = 4."}, {"q": "ടാർഗെറ്റ് CPA ₹800 ആണ്, 5% ക്ലിക്കുകൾ കൺവേർട്ട് ചെയ്യുന്നു. പരമാവധി CPC എത്ര?", "options": ["₹40", "₹160", "₹16"], "answer": 0, "why": "₹800 × 0.05 = ₹40."}]}, {"title": "റിറ്റൻഷൻ, കോഹോർട്ടുകൾ, ലൈഫ്സൈക്കിൾ", "minutes": 12, "intro": "ചോർന്നുപോകുന്ന വളർച്ച ചെലവേറിയതാണ്. ഉപഭോക്താക്കൾ തുടരുന്നുണ്ടോ എന്ന് കോഹോർട്ട് വിശകലനം കാണിക്കുന്നു, ശരിയായവരെ തിരികെ കൊണ്ടുവരാൻ ലൈഫ്സൈക്കിൾ സന്ദേശങ്ങൾ സഹായിക്കുന്നു.", "points": ["ഒരേ കാലയളവിൽ തുടങ്ങിയവരുടെ ഗ്രൂപ്പാണ് കോഹോർട്ട്. ഓരോ കോഹോർട്ടിലെയും എത്ര ശതമാനം പിന്നീടുള്ള ഓരോ മാസത്തിലും സജീവമായി തുടരുന്നു എന്ന് നോക്കുക.", "പരന്നുവരുന്ന (flatten) റിറ്റൻഷൻ കർവ് അർഥമാക്കുന്നത് ഒരു കോർ ഗ്രൂപ്പ് ഉൽപ്പന്നം ഉപയോഗിച്ചുകൊണ്ടിരിക്കുന്നു എന്നാണ്. പൂജ്യത്തിലേക്ക് താഴ്ന്നുകൊണ്ടേയിരിക്കുന്ന കർവ് അർഥമാക്കുന്നത് ഉൽപ്പന്നം ഇതുവരെ ആരെയും പിടിച്ചുനിർത്തുന്നില്ല എന്നാണ്.", "RFM (Recency, Frequency, Monetary value: അവസാനം എപ്പോൾ വാങ്ങി, എത്ര തവണ വാങ്ങി, എത്ര തുകയ്ക്ക് വാങ്ങി) സ്കോറിംഗ് ഉപഭോക്താക്കളെ റാങ്ക് ചെയ്യുന്നു, അങ്ങനെ സന്ദേശങ്ങൾ എല്ലാവർക്കും പോകാതെ അവ യോജിക്കുന്നവർക്ക് പോകുന്നു."], "example": "ജനുവരിയിൽ ചേർന്ന 1,000 പേരിൽ 600 പേർ 1-ാം മാസത്തിലും 450 പേർ 2-ാം മാസത്തിലും 400 പേർ 3-ാം മാസത്തിലും 390 പേർ 4-ാം മാസത്തിലും സജീവമാണ്. കുറവ് 150, 50, 10 എന്നിങ്ങനെ ചുരുങ്ങുന്നു, അതിനാൽ കർവ് ഏകദേശം 39% ൽ പരക്കുന്നു: ഒരു കോർ ഗ്രൂപ്പ് തുടരുന്നുണ്ട്. വിൻ-ബാക്ക് സന്ദേശങ്ങൾ പോകേണ്ടത് അടുത്തിടെ വിട്ടുപോയ, പതിവായി ഉപയോഗിച്ചിരുന്നവർക്കാണ്, മുഴുവൻ ലിസ്റ്റിനുമല്ല.", "mistake": "എല്ലാ ഉപഭോക്താക്കൾക്കും കൂടി ഒരൊറ്റ ബ്ലെൻഡഡ് റിറ്റൻഷൻ നിരക്ക് റിപ്പോർട്ട് ചെയ്യുന്നത്. പുതിയതും പഴയതുമായ കോഹോർട്ടുകൾ കൂടിക്കലർന്നാൽ റിറ്റൻഷൻ മെച്ചപ്പെടുകയാണോ മോശമാകുകയാണോ എന്ന് മറയ്ക്കപ്പെടും.", "takeaways": ["റിറ്റൻഷൻ കോഹോർട്ട് അനുസരിച്ച് വായിക്കുക, ഒരിക്കലും ബ്ലെൻഡഡ് ആയിട്ടല്ല.", "കർവ് പരക്കുന്നത് അക്വിസിഷൻ വർധിപ്പിച്ചു തുടങ്ങാനുള്ള സൂചനയാണ്.", "സന്ദേശം അയയ്ക്കുംമുമ്പ് സെഗ്മെന്റ് ചെയ്യുക."], "quiz": [{"q": "പരന്നുവരുന്ന റിറ്റൻഷൻ കർവ് നിങ്ങളോട് എന്താണ് പറയുന്നത്?", "options": ["എല്ലാവരും ഒടുവിൽ വിട്ടുപോകും", "ഒരു കോർ ഗ്രൂപ്പ് ഉൽപ്പന്നം ഉപയോഗിച്ചുകൊണ്ടിരിക്കുന്നു", "അക്വിസിഷൻ നിലച്ചു"], "answer": 1, "why": "പരന്ന വാൽ അർഥമാക്കുന്നത് ബാക്കിയുള്ള ഉപഭോക്താക്കൾ മാസംതോറും തുടരുന്നു എന്നാണ്."}, {"q": "RFM ലെ അക്ഷരങ്ങൾ എന്തിനെ സൂചിപ്പിക്കുന്നു?", "options": ["Reach, frequency, media", "Recency, frequency, monetary value", "Revenue, funnel, margin"], "answer": 1, "why": "RFM ഉപഭോക്താക്കളെ റാങ്ക് ചെയ്യുന്നത് അവർ എത്ര അടുത്തിടെ, എത്ര തവണ, എത്ര തുകയ്ക്ക് വാങ്ങുന്നു എന്നതിനെ അടിസ്ഥാനമാക്കിയാണ്."}]}, {"title": "ഫസ്റ്റ്-പാർട്ടി ഡാറ്റയും സമ്മതവും", "minutes": 10, "intro": "ഉപഭോക്താക്കൾ വ്യക്തമായ സമ്മതത്തോടെ നേരിട്ട് നിങ്ങൾക്ക് നൽകുന്ന ഡാറ്റയാണ് നിങ്ങൾക്ക് കിട്ടാവുന്ന ഏറ്റവും വിശ്വസനീയവും ഉപയോഗിക്കാൻ ഏറ ചെയ്തിരിക്കുന്ന ബോക്സ് വ്യക്തിയുടെ ഭാഗത്തുനിന്ന് ഒരു പ്രവൃത്തിയും രേഖപ്പെടുത്തുന്നില്ല."}]}]}};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} } };
const params = new URLSearchParams(location.search);
let lang = [params.get('lang'), store.get('dm-lang')].find(l => l && DATA[l]) || 'en';
let at = 0;

Object.values(DATA).forEach(d => $('lang').append(new Option(d.langName, d.lang)));

function list(items){ const ul = el('ul'); items.forEach(t => ul.append(el('li', null, t))); return ul; }

function quiz(q, i, u){
  const box = el('div', 'q'), fb = el('p', 'fb');
  box.append(el('p', null, (i + 1) + '. ' + q.q));
  q.options.forEach((o, k) => {
    const lab = el('label', 'opt'), inp = el('input'); inp.type = 'radio'; inp.name = 'q' + at + '-' + i; inp.value = k;
    lab.append(inp, el('span', null, o)); box.append(lab);
  });
  const b = el('button', 'btn ghost', u.check);
  b.onclick = () => {
    const pick = box.querySelector('input:checked');
    if (!pick) return;
    const ok = Number(pick.value) === q.answer;
    fb.className = 'fb ' + (ok ? 'ok' : 'no'); fb.textContent = (ok ? u.correct : u.wrong) + ' ' + q.why;
  };
  box.append(b, fb); return box;
}

function render(){
  const d = DATA[lang], u = d.ui, m = d.modules[at];
  document.documentElement.lang = lang; document.title = u.courseTitle;
  $('lang').value = lang; $('langLabel').textContent = u.language; $('brand').textContent = u.courseTitle;
  $('level').textContent = u.level; $('title').textContent = u.courseTitle; $('sub').textContent = u.courseSub; $('note').textContent = u.note;
  $('toc').replaceChildren(...d.modules.map((mod, i) => {
    const b = el('button'); b.append(el('span', 'n', i + 1), el('span', null, mod.title));
    b.setAttribute('aria-current', i === at); b.onclick = () => go(i); return b;
  }));
  const a = $('lesson');
  a.replaceChildren(
    el('div', 'meta', u.lesson + ' ' + (at + 1) + ' · ' + m.minutes + ' ' + u.minutes), el('h2', null, m.title),
    el('p', 'intro', m.intro), list(m.points),
    el('h3', null, u.example), el('div', 'box ex', m.example),
    el('h3', null, u.mistake), el('div', 'box warn', m.mistake),
    el('h3', null, u.takeaways), list(m.takeaways),
    el('h3', null, u.quiz), ...m.quiz.map((q, i) => quiz(q, i, u)));
  $('prev').textContent = '← ' + u.prev; $('next').textContent = u.next + ' →';
  $('prev').disabled = at === 0; $('next').disabled = at === d.modules.length - 1;
  $('prev').style.visibility = at === 0 ? 'hidden' : 'visible'; $('next').style.visibility = at === d.modules.length - 1 ? 'hidden' : 'visible';
}
function go(i){ at = i; render(); $('lesson').scrollIntoView({ block: 'start' }); }
$('lang').onchange = e => { lang = e.target.value; store.set('dm-lang', lang); const p = new URL(location); p.searchParams.set('lang', lang); history.replaceState(null, '', p); render(); };
$('prev').onclick = () => go(at - 1); $('next').onclick = () => go(at + 1);
render();
</script>
